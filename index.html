    +'</div>';
}

/* ---------- Step 7: Summary sheet ---------- */
function renderSummary(){
  const missing=[];
  if(!abilitiesDone()) missing.push("Ability scores are not fully assigned (Step I).");
  if(!S.race) missing.push("No race chosen (Step II).");
  if(S.race && RACES[S.race].asiChoice && S.halfElf.filter(Boolean).length<2) missing.push("Half-Elf +1 ability choices incomplete (Step II).");
  if(!S.klass) missing.push("No class chosen (Step III).");
  if(S.klass){
    const b=skillBudget(), fromClass=S.skills.filter(s=>CLASSES[S.klass].skills.from.includes(s)).length;
    if(fromClass<b.classCount) missing.push("Class skill picks incomplete (Step IV).");
    const sc=CLASSES[S.klass].spellcasting;
    if(sc){
      if(S.cantrips.length<cantripsKnownAt()) missing.push("Cantrip picks incomplete (Step IV).");
      if(S.spells1.length<spellBudget()) missing.push("Spell picks incomplete — "+S.spells1.length+" of "+spellBudget()+" (Step IV).");
    }
    if(subclassUnlocked() && subclassInfo() && !S.subclass)
      missing.push("No "+subclassInfo().label+" chosen (Step IV).");
    availableASIs().forEach(L=>{
      const p=S.asiPicks[L];
      if(!p) missing.push("Level "+L+" ability improvement or feat not chosen (Step IV).");
      else if(p.mode==="feat"&&!p.feat) missing.push("Level "+L+" feat not chosen (Step IV).");
      else if(p.mode!=="feat"&&(!p.a1||!p.a2)) missing.push("Level "+L+" ability increases incomplete (Step IV).");
    });
  }
  if(!S.background) missing.push("No background chosen (Step V).");
  if(!S.name) missing.push("Your hero has no name (Step VII).");
  if(!S.alignment) missing.push("No alignment chosen (Step VII).");

  const warn = missing.length
    ? '<div class="incomplete-warn no-print"><b>The forge is not yet finished:</b><ul>'+missing.map(m=>'<li>'+m+'</li>').join('')+'</ul></div>' : "";

  let sheet="";
  if(S.klass && S.race){
    const f=finalScores(), c=CLASSES[S.klass], r=RACES[S.race];
    const acInfo=computeAC(), hp=computeHP(), pb=profBonus();
    const granted=grantedSkills();
    const profSkills=new Set([...S.skills, ...granted]);
    const skillLines=Object.keys(SKILLS).sort().map(sk=>{
      const ab=SKILLS[sk], isProf=profSkills.has(sk);
      const bonus=mod(f[ab])+(isProf?pb:0);
      return '<div class="skill-line'+(isProf?' prof':'')+'"><span>'+sk+' <small>('+ab.toUpperCase()+')</small></span><span>'+fmtMod(bonus)+'</span></div>';
    }).join('');
    const saveLines=ABILITIES.map(a=>{
      const isProf=c.saves.includes(a);
      return '<div class="skill-line'+(isProf?' prof':'')+'"><span>'+ABILITY_INFO[a].name+'</span><span>'+fmtMod(mod(f[a])+(isProf?pb:0))+'</span></div>';
    }).join('');
    const feats=[];
    r.traits.forEach(t=>feats.push([t.n+" ("+S.race+")",t.d]));
    allFeatures().forEach(ft=>feats.push([ft.n+" ("+ft.src+", level "+ft.lvl+")",ft.d]));
    if(S.background) feats.push([BACKGROUNDS[S.background].feature.n+" ("+S.background+")",BACKGROUNDS[S.background].feature.d]);
    chosenFeats().forEach(fn=>{ if(FEATS[fn]) feats.push(["Feat: "+fn,FEATS[fn].d]); });
    Object.entries(S.classChoices).forEach(([k,v])=>{ if(v) feats.push(["Choice — "+k,v]); });
    Object.entries(S.raceChoices).forEach(([k,v])=>{ if(v) feats.push(["Choice — "+k,v]); });

    const equipList=[];
    Object.entries(S.equip).forEach(([g,o])=>equipList.push(o+" ("+g+")"));
    c.fixedEquip.forEach(e=>equipList.push(e));
    if(S.background) BACKGROUNDS[S.background].equipment.forEach(e=>equipList.push(e));
    S.items.forEach(i=>equipList.push("<b>"+i+"</b>"+(MAGIC_ITEMS[i]?" <small>("+MAGIC_ITEMS[i].rarity+(MAGIC_ITEMS[i].attune?", attuned":"")+")</small>":"")));

    const skinLabel=S.race==="Dragonborn"?"Scales":"Skin";
    const atkRows=characterWeapons().map(([name,note])=>{
      const L=attackLine(name);
      return '<div class="atk-line"><span><b>'+name+'</b>'+note+'<br><small>'+L.props+'</small></span>'
        +'<span style="text-align:right;white-space:nowrap"><b>'+fmtMod(L.hit)+'</b> to hit<br>'+L.dmg+'</span></div>';
    }).join('');
    const atkNotes='<div style="font-size:.75rem;color:#6b5a35;margin-top:6px">To hit = proficiency + ability modifier (Dex for ranged/finesse, otherwise Str). '
      +(S.klass==="Barbarian"?"Add +2 damage to Strength melee attacks while raging. ":"")
      +(S.klass==="Rogue"?"Sneak Attack adds +1d6 once per turn when you have advantage or an ally is adjacent to the target. ":"")
      +(S.klass==="Monk"?"Martial Arts: unarmed strikes deal 1d4 and may use Dex; bonus-action unarmed strike after attacking. ":"")+'</div>';

    let spellBox="";
    const sc=c.spellcasting;
    if(sc){
      const dc=8+pb+mod(f[sc.ability]), atk=pb+mod(f[sc.ability]);
      const allL1=[...new Set([...autoSpells(),...S.spells1])]
        .sort((a,b)=>((SPELLS[a]||{}).lvl||0)-((SPELLS[b]||{}).lvl||0)||a.localeCompare(b));
      const ps=pactSlots(), st=slotTable();
      const slotText = ps ? ("<b>"+ps[0]+"</b> pact slot"+(ps[0]===1?"":"s")+" of level <b>"+ps[1]+"</b> (short rest)")
        : (st.length?st.map((n,i)=>"L"+(i+1)+": "+n).join(" · "):"none yet");
      spellBox='<div class="sheet-box" style="grid-column:1/-1"><h4>Spellcasting — '+ABILITY_INFO[sc.ability].name+'</h4>'
        +'<div>Spell save DC <b>'+dc+'</b> · Spell attack <b>'+fmtMod(atk)+'</b></div>'
        +'<div><b>Slots:</b> '+slotText+'</div>'
        +'<div style="margin-top:6px"><b>Cantrips:</b> '+(S.cantrips.join(", ")||"—")+'</div>'
        +'<div><b>Spells:</b> '+(allL1.map(n=>n+" <small>("+((SPELLS[n]||{}).lvl||0)+")</small>").join(", ")||"—")+'</div>'
        +drill("Full spell details — casting time, range, components, duration", spellDetails(S.cantrips.concat(allL1)))
        +'</div>';
    }

    const persona=Object.entries({["Personality"]:S.persona.traits,Ideals:S.persona.ideals,Bonds:S.persona.bonds,Flaws:S.persona.flaws})
      .filter(([,v])=>v).map(([k,v])=>'<div><b>'+k+':</b> '+v+'</div>').join('')||'<i>Not yet written…</i>';

    sheet='<div class="sheet" id="print-sheet">'
      +'<h2><span class="char-name">'+(S.name||"Unnamed Hero")+'</span></h2>'
      +'<div class="id-line">Level '+S.level+' '+S.race+' '+S.klass+(S.subclass?' ('+S.subclass+')':'')
      +(S.background?' · '+S.background:'')+(S.alignment?' · '+S.alignment:'')+' · '+S.xp.toLocaleString()+' XP</div>'
      +'<div class="sheet-abilities">'+ABILITIES.map(a=>'<div class="sheet-ab" title="'+ABILITY_INFO[a].name+' — '+ABILITY_INFO[a].desc+'"><div class="sa-name">'+ABILITY_INFO[a].name.slice(0,3)+'</div><div class="sa-mod">'+fmtMod(mod(f[a]))+'</div><div class="sa-score">'+f[a]+'</div></div>').join('')+'</div>'
      +'<div class="combat-row">'
      +'<div class="combat-stat"><div class="cs-val">'+acInfo.ac+'</div><div class="cs-label">Armor Class</div><div class="cs-sub">Touch '+acInfo.touch+' · Flat-footed '+acInfo.flat+'</div></div>'
      +'<div class="combat-stat"><div class="cs-val">'+hp+'</div><div class="cs-label">Hit Points</div></div>'
      +'<div class="combat-stat"><div class="cs-val">'+S.level+'d'+c.hitDie+'</div><div class="cs-label">Hit Dice</div></div>'
      +'<div class="combat-stat"><div class="cs-val">'+fmtMod(mod(f.dex))+'</div><div class="cs-label">Initiative</div></div>'
      +'<div class="combat-stat"><div class="cs-val">'+r.speed+'</div><div class="cs-label">Speed (ft.)</div></div>'
      +'<div class="combat-stat"><div class="cs-val">+'+pb+'</div><div class="cs-label">Proficiency</div></div>'
      +'<div class="combat-stat"><div class="cs-val">'+(10+mod(f.wis)+(profSkills.has("Perception")?pb:0))+'</div><div class="cs-label">Passive Perception</div></div>'
      +'</div>'
      +'<div class="sheet-grid">'
      +'<div class="sheet-stack">'
      +  '<div class="sheet-box"><h4>Saving Throws</h4>'+saveLines+'</div>'
      +  '<div class="sheet-box"><h4>Attacks</h4>'+atkRows+atkNotes+'</div>'
      +'</div>'
      +'<div class="sheet-box"><h4>Skills</h4>'+skillLines+'</div>'
      +'<div class="sheet-box span2"><h4>Features &amp; Traits</h4><ul>'+feats.map(([n,d])=>'<li><span class="feature-name">'+n+'.</span> '+d+'</li>').join('')+'</ul></div>'
      +'<div class="sheet-box"><h4>Equipment</h4><ul>'+(equipList.map(e=>'<li>'+e+'</li>').join('')||'<li>—</li>')+'</ul>'
      +'<div style="margin-top:6px"><b>Armor worn:</b> '+acInfo.armorKey+(S.shield?' + shield':'')+(acInfo.stealthDis?' (Stealth disadvantage)':'')+'</div></div>'
      +spellBox
      +'<div class="sheet-box"><h4>Proficiencies &amp; Languages</h4>'
      +'<div><b>Armor:</b> '+c.armorProf+'</div><div><b>Weapons:</b> '+c.weaponProf+'</div><div><b>Tools:</b> '+[c.toolProf,...(S.background?BACKGROUNDS[S.background].tools:[])].filter(x=>x&&x!=="None").join("; ")+'</div>'
      +'<div><b>Languages:</b> '+r.languages.join(", ")+(S.background&&BACKGROUNDS[S.background].languages?(" + "+BACKGROUNDS[S.background].languages+" of your choice"):"")+'</div></div>'
      +'<div class="sheet-box"><h4>Appearance</h4>'
      +([["Height",S.body.height],["Weight",S.body.weight],["Hair",S.body.hair],["Eyes",S.body.eyes],[skinLabel,S.body.skin]]
        .filter(([,v])=>v&&v!=="__custom").map(([k,v])=>'<div><b>'+k+':</b> '+v+'</div>').join('')
        ||'<i>Not yet described — see Step VII…</i>')
      +(S.body.notes?'<div style="margin-top:6px;font-style:italic">'+S.body.notes+'</div>':'')
      +'</div>'
      +'<div class="sheet-box"><h4>Persona</h4>'+persona+'</div>'
      +'<div class="sheet-art">'+(S.art
        ?'<img src="'+S.art+'" alt="Character art">'
        :'<div style="color:#a89a70;font-style:italic;text-align:center">A half page awaits your hero\'s portrait —<br>add a JPG or PNG in Step VII</div>')+'</div>'
      +'</div></div>';
  } else {
    sheet='<div class="rules-note">Choose at least a race and a class to see your character sheet.</div>';
  }

  $("step-summary").innerHTML=
    '<div class="panel no-print" style="margin-bottom:14px"><h2><span class="ornament">🏆</span> The Finished Hero</h2>'
    +'<p class="lede">Review the completed character sheet below. Print it, or save it as JSON to keep or import elsewhere.</p>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap">'
    +'<button class="btn gold" data-act="print">🖨 Print Sheet</button>'
    +'<button class="btn" data-act="download">💾 Download JSON</button>'
    +'<button class="btn" data-act="reset" title="Start a brand new character">☠ Start Over</button>'
    +'</div></div>'
    +warn+sheet
    +'<div class="step-footer no-print"><button class="btn" data-goto="6">◂ Details</button><span></span></div>';
}

/* =====================================================================
   RENDER + EVENTS
===================================================================== */
const RENDERERS=[renderAbilities,renderRace,renderClass,renderAdvancement,renderBackground,renderEquipment,renderDetails,renderSummary];
function render(){
  const y=window.scrollY;
  renderNav();
  RENDERERS[S.step]();
  save();
  // re-rendering replaces the DOM wholesale; keep the reader where they were
  if(y) window.scrollTo(0,y);
}
function save(){ try{ localStorage.setItem("forge-of-heroes", JSON.stringify(S)); }catch(e){} }
function load(){
  try{
    const raw=localStorage.getItem("forge-of-heroes");
    if(raw){
      const d=JSON.parse(raw);
      delete d.method; delete d.pb;
      // migrate pre-drag-and-drop saves that stored scores instead of die indices
      if(d.assigned && Object.values(d.assigned).some(v=>+v>5)) d.assigned={str:"",dex:"",con:"",int:"",wis:"",cha:""};
      if(!d.body) d.body={hair:"",eyes:"",skin:"",height:"",weight:"",notes:""};
      if(!d.level) d.level=1;
      if(d.xp==null) d.xp=0;
      if(!d.asiPicks) d.asiPicks={};
      if(!d.hpRolls) d.hpRolls=[];
      if(!d.hpMode) d.hpMode="average";
      if(!d.items) d.items=[];
      if(d.subclass===undefined) d.subclass=null;
      Object.assign(S,d);
    }
  }catch(e){}
}

function roll4d6dl(){
  const d=[0,0,0,0].map(()=>1+Math.floor(Math.random()*6)).sort((a,b)=>b-a);
  return d[0]+d[1]+d[2];
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-goto],[data-act],[data-pick-race],[data-pick-class],[data-pick-bg],[data-pick-align],[data-pick-sub]");
  if(!t) return;
  if(t.dataset.goto!==undefined){ S.step=+t.dataset.goto; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(t.dataset.pickRace!==undefined){
    S.race=t.dataset.pickRace; S.raceChoices={}; S.halfElf=["",""];
    render(); return;
  }
  if(t.dataset.pickClass!==undefined){
    if(S.klass!==t.dataset.pickClass){
      S.classChoices={}; S.skills=[]; S.cantrips=[]; S.spells1=[];
      S.equip={}; S.armor=null; S.shield=false;
      S.subclass=null; S.asiPicks={}; S.hpRolls=[];
    }
    S.klass=t.dataset.pickClass; render(); return;
  }
  if(t.dataset.pickBg!==undefined){
    S.background=t.dataset.pickBg;
    S.skills=S.skills.filter(sk=>!grantedSkills().has(sk)); // free up any now-granted picks
    render(); return;
  }
  if(t.dataset.pickAlign!==undefined){ S.alignment=t.dataset.pickAlign; render(); return; }
  if(t.dataset.pickSub!==undefined){ S.subclass=t.dataset.pickSub; render(); return; }
  if(t.dataset.act==="roll-hp"){
    rollHitDice();
    Dice.log("Hit dice (levels 2–"+S.level+"): "+S.hpRolls.join(", "));
    render(); return;
  }
  if(t.dataset.act==="roll-abilities"){
    S.rolled=[0,0,0,0,0,0].map(roll4d6dl).sort((a,b)=>b-a);
    S.assigned={str:"",dex:"",con:"",int:"",wis:"",cha:""};
    Dice.log("Ability scores (4d6 drop lowest): "+S.rolled.join(", "));
    render(); return;
  }
  if(t.dataset.act==="suggest-name"){
    const listKey=S.race&&NAME_SEEDS[S.race]?S.race:"Human";
    const names=NAME_SEEDS[listKey];
    S.name=names[Math.floor(Math.random()*names.length)];
    render(); return;
  }
  if(t.dataset.act==="art-clear"){ S.art=null; render(); return; }
  if(t.dataset.act==="art-pick"){ $("art-file").click(); return; }
  if(t.dataset.act==="print"){ window.print(); return; }
  if(t.dataset.act==="download"){
    const data={meta:"Forge of Heroes — D&D 5e character (open-licensed rules)",
      level:S.level,character:S,finalScores:finalScores(),
      ac:computeAC(),hp:computeHP(),proficiencyBonus:profBonus(),
      spellSlots:pactSlots()||slotTable(),features:allFeatures(),feats:chosenFeats()};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=(S.name||"character").replace(/[^\w\- ]/g,"")+".json";
    a.click(); URL.revokeObjectURL(a.href); return;
  }
  if(t.dataset.act==="reset"){
    if(confirm("Consign this hero to legend and begin anew?")){
      localStorage.removeItem("forge-of-heroes"); location.reload();
    }
    return;
  }
});

document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.assign){ S.assigned[t.dataset.assign]=t.value; render(); return; }
  if(t.dataset.body){ S.body[t.dataset.body]=t.value; render(); return; }
  if(t.id==="art-file"){
    const file=t.files&&t.files[0];
    if(!file) return;
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const maxSide=1000, scale=Math.min(1,maxSide/Math.max(img.width,img.height));
      const cv=document.createElement("canvas");
      cv.width=Math.round(img.width*scale); cv.height=Math.round(img.height*scale);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      S.art=cv.toDataURL(file.type==="image/png"?"image/png":"image/jpeg",0.85);
      URL.revokeObjectURL(url);
      render();
    };
    img.src=url;
    return;
  }
  if(t.dataset.halfelf!==undefined){ S.halfElf[+t.dataset.halfelf]=t.value; render(); return; }
  if(t.dataset.racechoice){ S.raceChoices[t.dataset.racechoice]=t.value; render(); return; }
  if(t.dataset.classchoice){ S.classChoices[t.dataset.classchoice]=t.value; render(); return; }
  if(t.dataset.skill){
    const sk=t.dataset.skill, c=CLASSES[S.klass], b=skillBudget();
    if(t.checked){
      const inClass=c.skills.from.includes(sk);
      const fromClass=S.skills.filter(s=>c.skills.from.includes(s)).length;
      const fromAny=S.skills.length-fromClass;
      const classFull=fromClass>=b.classCount, anyFull=fromAny>=b.anyCount;
      // a class-list skill can spill into the "any" pool if class picks are full
      if((inClass && (!classFull || !anyFull)) || (!inClass && !anyFull)){
        S.skills.push(sk);
      }
    } else {
      S.skills=S.skills.filter(s=>s!==sk);
    }
    render(); return;
  }
  if(t.dataset.spell){
    const group=t.dataset.spell, name=t.dataset.name;
    const max=group==="cantrips"?cantripsKnownAt():spellBudget();
    const arr=group==="cantrips"?S.cantrips:S.spells1;
    if(t.checked){ if(arr.length<max && !arr.includes(name)) arr.push(name); }
    else{ const i=arr.indexOf(name); if(i>=0) arr.splice(i,1); }
    render(); return;
  }
  if(t.dataset.hpmode){ S.hpMode=t.dataset.hpmode; if(S.hpMode==="rolled"&&!S.hpRolls.length) rollHitDice(); render(); return; }
  if(t.dataset.asiMode){ const L=t.dataset.asiMode;
    S.asiPicks[L]=Object.assign({a1:"",a2:"",feat:"",featAbil:""},S.asiPicks[L],{mode:t.value}); render(); return; }
  if(t.dataset.asiAbil){ const L=t.dataset.asiAbil;
    S.asiPicks[L]=Object.assign({mode:"asi",a1:"",a2:""},S.asiPicks[L]);
    S.asiPicks[L]["a"+t.dataset.slot]=t.value; render(); return; }
  if(t.dataset.asiFeat){ const L=t.dataset.asiFeat;
    S.asiPicks[L]=Object.assign({mode:"feat"},S.asiPicks[L],{feat:t.value,featAbil:""}); render(); return; }
  if(t.dataset.asiFeatabil){ const L=t.dataset.asiFeatabil;
    S.asiPicks[L]=Object.assign({mode:"feat"},S.asiPicks[L],{featAbil:t.value}); render(); return; }
  if(t.dataset.item){
    const it=t.dataset.item;
    if(t.checked){ if(!S.items.includes(it)) S.items.push(it); }
    else S.items=S.items.filter(x=>x!==it);
    render(); return;
  }
  if(t.dataset.equipGroup){ S.equip[t.dataset.equipGroup]=t.dataset.equipOpt; render(); return; }
  if(t.dataset.armor){ S.armor=t.dataset.armor; render(); return; }
  if(t.dataset.shield!==undefined){ S.shield=t.checked; render(); return; }
  if(t.dataset.persona){ S.persona[t.dataset.persona]=t.value; save(); return; }
});
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="char-name"){ S.name=t.value; save(); }
  if(t.dataset&&("levelSlider" in t.dataset)){
    const newL=Math.max(1,Math.min(MAX_LEVEL,+t.value||1));
    if(newL!==S.level){
      S.level=newL;
      S.xp=xpForLevel(newL);
      if(S.hpMode==="rolled") rollHitDice();
      // drop any subclass/ASI choices that this level no longer grants
      if(!subclassUnlocked()) S.subclass=null;
      Object.keys(S.asiPicks).forEach(L=>{ if(+L>S.level) delete S.asiPicks[L]; });
      render();
    }
    return;
  }
  if(t.dataset&&("xp" in t.dataset)){
    S.xp=Math.max(0,+t.value||0);
    const L=levelForXP(S.xp);
    if(L!==S.level){
      S.level=L;
      if(S.hpMode==="rolled") rollHitDice();
      if(!subclassUnlocked()) S.subclass=null;
      Object.keys(S.asiPicks).forEach(lv=>{ if(+lv>S.level) delete S.asiPicks[lv]; });
    }
    render(); return;
  }
  if(t.dataset&&t.dataset.bodycustom){ S.body[t.dataset.bodycustom]=t.value||"__custom"; save(); }
  if(t.dataset&&("bodynotes" in t.dataset)){ S.body.notes=t.value; save(); }
});

/* ---------- drag & drop: rolled dice onto abilities ---------- */
document.addEventListener("dragstart",e=>{
  const die=e.target.closest&&e.target.closest(".rolled-die[data-die]");
  if(die){ e.dataTransfer.setData("text/plain",die.dataset.die); e.dataTransfer.effectAllowed="move"; die.classList.add("dragging"); }
});
document.addEventListener("dragend",()=>{
  document.querySelectorAll(".rolled-die.dragging").forEach(d=>d.classList.remove("dragging"));
  document.querySelectorAll(".ability-box.drop-ok").forEach(b=>b.classList.remove("drop-ok"));
});
document.addEventListener("dragover",e=>{
  const box=e.target.closest&&e.target.closest(".ability-box[data-abil]");
  if(box){ e.preventDefault(); e.dataTransfer.dropEffect="move"; box.classList.add("drop-ok"); }
});
document.addEventListener("dragleave",e=>{
  const box=e.target.closest&&e.target.closest(".ability-box[data-abil]");
  if(box) box.classList.remove("drop-ok");
});
document.addEventListener("drop",e=>{
  const box=e.target.closest&&e.target.closest(".ability-box[data-abil]");
  if(!box) return;
  e.preventDefault();
  const idx=e.dataTransfer.getData("text/plain");
  if(idx==="") return;
  const a=box.dataset.abil;
  const prevOwner=ABILITIES.find(x=>x!==a && S.assigned[x]!=="" && S.assigned[x]!=null && +S.assigned[x]===+idx);
  const displaced=S.assigned[a];
  S.assigned[a]=idx;
  if(prevOwner) S.assigned[prevOwner]=(displaced!==""&&displaced!=null)?displaced:"";
  render();
});

/* =====================================================================
   DICE ROLLER
===================================================================== */
const Dice={
  last:null,
  roll(sides){
    const count=Math.max(1,Math.min(20, +$("dice-count").value||1));
    const modv=Math.max(-20,Math.min(20, +$("dice-mod").value||0));
    const advmode=document.querySelector("input[name=advmode]:checked").value;
    let rolls=[], note="", total=0, critMsg="";
    if(sides===20 && count===1 && advmode!=="normal"){
      const r1=1+Math.floor(Math.random()*20), r2=1+Math.floor(Math.random()*20);
      const kept=advmode==="adv"?Math.max(r1,r2):Math.min(r1,r2);
      rolls=[kept]; total=kept+modv;
      note="("+r1+", "+r2+") keep "+(advmode==="adv"?"highest":"lowest");
      if(kept===20) critMsg='<div class="crit">Natural 20 — critical!</div>';
      if(kept===1) critMsg='<div class="fumble">Natural 1 — fumble!</div>';
    } else {
      for(let i=0;i<count;i++) rolls.push(1+Math.floor(Math.random()*sides));
      total=rolls.reduce((a,b)=>a+b,0)+modv;
      if(sides===20&&count===1){
        if(rolls[0]===20) critMsg='<div class="crit">Natural 20 — critical!</div>';
        if(rolls[0]===1) critMsg='<div class="fumble">Natural 1 — fumble!</div>';
      }
    }
    const label=count+"d"+sides+(modv?fmtMod(modv):"")+(note?" "+note:"");
    const box=$("dice-result");
    box.classList.remove("rolling"); void box.offsetWidth; box.classList.add("rolling");
    box.innerHTML='<div class="total">'+total+'</div><div class="breakdown">'+label+' — ['+rolls.join(", ")+']'+(modv?" "+fmtMod(modv):"")+'</div>'+critMsg;
    this.last=sides;
    this.log("<b>"+total+"</b> ⟵ "+label+" ["+rolls.join(", ")+"]");
  },
  rollCustom(){ this.roll(this.last||20); },
  log(msg){
    const el=$("dice-log");
    const d=document.createElement("div");
    d.className="log-entry"; d.innerHTML=msg;
    el.prepend(d);
    while(el.children.length>30) el.removeChild(el.lastChild);
  },
  clearLog(){ $("dice-log").innerHTML=""; }
};
$("dice-toggle").addEventListener("click",()=>$("dice-tray").classList.toggle("open"));

/* ---------- boot ---------- */
load();
render();
</script>
