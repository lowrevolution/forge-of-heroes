<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forge of Heroes — D&D 5e Character Generator</title>
<style>
  /* ============ THEME ============ */
  :root{
    --ink:#e8ddc0;
    --ink-dim:#b3a887;
    --gold:#c9a227;
    --gold-bright:#ffd75e;
    --blood:#8e1c1c;
    --blood-bright:#c53030;
    --bg-deep:#100c08;
    --bg-panel:#1c150e;
    --bg-panel2:#241b11;
    --bg-card:#2b2013;
    --parchment:#e9dcb8;
    --parchment-ink:#2a1f10;
    --border-gold:#8a6d1f;
    --border-dim:#4a3a1c;
    --ok:#6fbf5e;
    --arcane:#7f6bd1;
    --shadow:0 6px 24px rgba(0,0,0,.55);
    --serif:Georgia,'Palatino Linotype','Book Antiqua',Palatino,serif;
    --small-caps:Georgia,'Palatino Linotype',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:
      radial-gradient(ellipse at 20% 0%, rgba(201,162,39,.07), transparent 45%),
      radial-gradient(ellipse at 85% 100%, rgba(142,28,28,.08), transparent 45%),
      var(--bg-deep);
    color:var(--ink);
    font-family:var(--serif);
    line-height:1.55;
    min-height:100vh;
  }
  /* subtle texture */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;z-index:0;
    background-image:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.12) 2px 3px),
      repeating-linear-gradient(90deg, transparent 0 3px, rgba(255,255,255,.012) 3px 4px);
  }
  #app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:24px 20px 120px}

  /* ============ HEADER ============ */
  header.banner{
    text-align:center;padding:34px 16px 26px;margin-bottom:22px;position:relative;
    border:1px solid var(--border-gold);border-radius:8px;
    background:linear-gradient(180deg, #241a0d, #17110a 70%);
    box-shadow:var(--shadow), inset 0 0 60px rgba(0,0,0,.5);
  }
  header.banner::before,header.banner::after{
    content:"❖";color:var(--gold);position:absolute;top:8px;font-size:14px;opacity:.8;
  }
  header.banner::before{left:12px} header.banner::after{right:12px}
  .banner h1{
    font-size:clamp(1.9rem,4.5vw,3rem);letter-spacing:.06em;color:var(--gold-bright);
    text-transform:uppercase;font-variant:small-caps;
    text-shadow:0 2px 8px rgba(0,0,0,.8), 0 0 30px rgba(201,162,39,.25);
  }
  .banner .sub{color:var(--ink-dim);font-style:italic;margin-top:6px;font-size:1.02rem}
  .banner .rule-line{
    width:min(420px,80%);height:1px;margin:14px auto 0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative;
  }
  .banner .rule-line::after{
    content:"⚜";position:absolute;left:50%;top:-11px;transform:translateX(-50%);
    color:var(--gold);background:transparent;font-size:15px;
  }

  /* ============ STEP NAV ============ */
  nav.steps{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:26px;position:sticky;top:8px;z-index:50;
  }
  nav.steps button{
    font-family:var(--serif);font-variant:small-caps;letter-spacing:.05em;font-size:.95rem;
    background:var(--bg-panel);color:var(--ink-dim);border:1px solid var(--border-dim);
    border-radius:20px;padding:7px 16px;cursor:pointer;transition:all .2s;box-shadow:0 3px 10px rgba(0,0,0,.4);
  }
  nav.steps button:hover{border-color:var(--gold);color:var(--ink)}
  nav.steps button.active{background:linear-gradient(180deg,#3a2c12,#2b2013);color:var(--gold-bright);border-color:var(--gold)}
  nav.steps button.done::before{content:"✦ ";color:var(--ok)}

  /* ============ SECTION / PANEL ============ */
  section.step{display:none;animation:fadeUp .35s ease}
  section.step.visible{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .panel{
    background:linear-gradient(180deg,var(--bg-panel2),var(--bg-panel));
    border:1px solid var(--border-gold);border-radius:8px;box-shadow:var(--shadow);
    padding:24px 26px;margin-bottom:20px;position:relative;
  }
  .panel::before{
    content:"";position:absolute;inset:5px;border:1px solid rgba(201,162,39,.18);border-radius:5px;pointer-events:none;
  }
  .panel h2{
    font-variant:small-caps;letter-spacing:.07em;color:var(--gold);font-size:1.6rem;margin-bottom:4px;
    display:flex;align-items:center;gap:10px;
  }
  .panel h2 .ornament{color:var(--blood-bright);font-size:1.1rem}
  .panel .lede{color:var(--ink-dim);font-style:italic;margin-bottom:18px;max-width:70ch}
  .rules-note{
    background:rgba(201,162,39,.06);border-left:3px solid var(--gold);padding:10px 14px;margin:12px 0;
    font-size:.93rem;color:var(--ink-dim);border-radius:0 4px 4px 0;
  }
  .rules-note b{color:var(--ink)}

  /* ============ CARDS GRID ============ */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px;margin-top:10px}
  .choice-card{
    background:var(--bg-card);border:1px solid var(--border-dim);border-radius:6px;padding:14px 15px;
    cursor:pointer;transition:all .18s;position:relative;
  }
  .choice-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.5)}
  .choice-card.selected{
    border-color:var(--gold-bright);
    background:linear-gradient(180deg,#3d2e12,#2b2013);
    box-shadow:0 0 0 1px var(--gold-bright), 0 0 22px rgba(255,215,94,.15);
  }
  .choice-card.selected::after{
    content:"✦ Chosen";position:absolute;top:8px;right:10px;font-size:.72rem;color:var(--gold-bright);
    font-variant:small-caps;letter-spacing:.06em;
  }
  .choice-card h3{color:var(--ink);font-size:1.12rem;font-variant:small-caps;letter-spacing:.04em}
  .choice-card .tagline{color:var(--ink-dim);font-size:.85rem;font-style:italic;margin:2px 0 8px}
  .choice-card .statline{font-size:.82rem;color:var(--gold);line-height:1.5}
  .choice-card .statline span{color:var(--ink-dim)}

  /* ============ DRILL-DOWN DETAILS ============ */
  details.drill{
    border:1px solid var(--border-dim);border-radius:6px;margin:8px 0;background:rgba(0,0,0,.22);overflow:hidden;
  }
  details.drill>summary{
    cursor:pointer;padding:10px 14px;font-variant:small-caps;letter-spacing:.05em;color:var(--gold);
    list-style:none;display:flex;align-items:center;gap:8px;user-select:none;font-size:1.02rem;
  }
  details.drill>summary::-webkit-details-marker{display:none}
  details.drill>summary::before{content:"▸";color:var(--blood-bright);transition:transform .2s;font-size:.85rem}
  details.drill[open]>summary::before{transform:rotate(90deg)}
  details.drill>summary:hover{background:rgba(201,162,39,.06)}
  details.drill .drill-body{padding:4px 16px 14px;font-size:.93rem;color:var(--ink)}
  details.drill .drill-body p{margin:6px 0}
  .trait{margin:8px 0;padding-left:12px;border-left:2px solid var(--border-dim)}
  .trait b{color:var(--gold);font-variant:small-caps;letter-spacing:.03em}
  .trait .t-desc{color:var(--ink-dim);font-size:.9rem}

  /* detail pane shown under grid when a card is picked */
  .detail-pane{
    margin-top:18px;border:1px solid var(--border-gold);border-radius:6px;padding:18px 20px;
    background:linear-gradient(180deg, rgba(201,162,39,.05), rgba(0,0,0,.25));
    animation:fadeUp .3s ease;
  }
  .detail-pane h3{color:var(--gold-bright);font-variant:small-caps;font-size:1.35rem;letter-spacing:.05em}
  .detail-pane .flavor{font-style:italic;color:var(--ink-dim);margin:4px 0 12px}
  .stat-chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
  .chip{
    background:rgba(201,162,39,.1);border:1px solid var(--border-dim);border-radius:14px;
    padding:3px 12px;font-size:.82rem;color:var(--ink);
  }
  .chip b{color:var(--gold)}

  /* ============ ABILITY SCORES ============ */
  .method-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 18px}
  .method-tabs button{
    font-family:var(--serif);background:var(--bg-card);color:var(--ink-dim);border:1px solid var(--border-dim);
    padding:8px 18px;border-radius:5px;cursor:pointer;font-size:.95rem;font-variant:small-caps;letter-spacing:.05em;transition:all .18s;
  }
  .method-tabs button.active{border-color:var(--gold);color:var(--gold-bright);background:#33260f}
  .ability-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:14px}
  .ability-box{
    background:var(--bg-card);border:1px solid var(--border-dim);border-radius:8px;text-align:center;padding:14px 10px;position:relative;
  }
  .ability-box .ab-name{font-variant:small-caps;letter-spacing:.08em;color:var(--gold);font-size:1rem}
  .ability-box .ab-desc{font-size:.72rem;color:var(--ink-dim);min-height:2.1em;margin:2px 0 6px}
  .ability-box select,.ability-box input[type=number]{
    font-family:var(--serif);font-size:1.35rem;text-align:center;width:84px;padding:4px;
    background:#191208;color:var(--ink);border:1px solid var(--border-gold);border-radius:5px;
  }
  .ability-box .ab-mod{
    margin-top:8px;font-size:1.05rem;color:var(--ink);
  }
  .ability-box .ab-mod b{color:var(--gold-bright);font-size:1.25rem}
  .ability-box .ab-race{font-size:.78rem;color:var(--ok);min-height:1.2em;margin-top:2px}
  .roll-pool{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
  .rolled-die{
    width:52px;height:52px;border-radius:8px;background:linear-gradient(160deg,#3b2c11,#241a09);
    border:1px solid var(--border-gold);display:flex;align-items:center;justify-content:center;
    font-size:1.35rem;color:var(--gold-bright);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 4px 8px rgba(0,0,0,.5);
    animation:diePop .35s ease;
  }
  @keyframes diePop{0%{transform:scale(.4) rotate(-20deg);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  .pb-remaining{font-size:1.05rem;margin:8px 0}
  .pb-remaining b{color:var(--gold-bright);font-size:1.3rem}

  /* ============ BUTTONS ============ */
  .btn{
    font-family:var(--serif);font-variant:small-caps;letter-spacing:.06em;font-size:1.02rem;
    background:linear-gradient(180deg,#a3242433,#5e131322),var(--bg-card);
    color:var(--ink);border:1px solid var(--blood-bright);border-radius:5px;
    padding:9px 22px;cursor:pointer;transition:all .18s;box-shadow:0 3px 10px rgba(0,0,0,.4);
  }
  .btn:hover{box-shadow:0 0 14px rgba(197,48,48,.35);transform:translateY(-1px)}
  .btn.gold{border-color:var(--gold);background:linear-gradient(180deg,#c9a22733,#8a6d1f22),var(--bg-card)}
  .btn.gold:hover{box-shadow:0 0 14px rgba(201,162,39,.4)}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
  .step-footer{display:flex;justify-content:space-between;margin-top:22px;gap:10px;flex-wrap:wrap}

  /* ============ SKILL / SPELL PICKERS ============ */
  .pick-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:10px 0}
  .pick-item{
    display:flex;gap:9px;align-items:flex-start;background:var(--bg-card);border:1px solid var(--border-dim);
    border-radius:5px;padding:8px 11px;cursor:pointer;transition:all .15s;font-size:.92rem;
  }
  .pick-item:hover{border-color:var(--gold)}
  .pick-item.picked{border-color:var(--gold-bright);background:#33260f}
  .pick-item.locked{opacity:.55;cursor:not-allowed}
  .pick-item input{accent-color:var(--gold);margin-top:3px}
  .pick-item .pi-name{color:var(--ink)}
  .pick-item .pi-sub{color:var(--ink-dim);font-size:.8rem;display:block}
  .pick-counter{font-size:.95rem;color:var(--ink-dim);margin:6px 0}
  .pick-counter b{color:var(--gold-bright)}
  .spell-block summary .lvl-tag{
    font-size:.72rem;background:rgba(127,107,209,.2);border:1px solid var(--arcane);color:#cfc4ff;
    padding:1px 8px;border-radius:10px;margin-left:6px;
  }

  /* ============ SUMMARY SHEET ============ */
  .sheet{
    background:var(--parchment);color:var(--parchment-ink);border-radius:8px;padding:28px 30px;
    box-shadow:var(--shadow);border:6px double #8a6d1f;font-family:var(--serif);
  }
  .sheet h2{font-variant:small-caps;letter-spacing:.06em;border-bottom:2px solid #8a6d1f;padding-bottom:6px;color:#5b4310}
  .sheet h2 .char-name{color:#2a1f10}
  .sheet .id-line{font-style:italic;color:#6b5a35;margin:4px 0 16px}
  /* Boxes size to their content rather than stretching, so a short box like
     Saving Throws does not leave dead space beneath it. */
  .sheet-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:start;grid-auto-flow:row dense}
  /* Two short boxes sharing one column */
  .sheet-stack{display:flex;flex-direction:column;gap:16px;min-width:0}
  /* Prose-heavy boxes read badly in a narrow column, so let them take two */
  .sheet-box.span2{grid-column:span 2}
  .sheet-box{border:1.5px solid #8a6d1f;border-radius:6px;padding:12px 14px;background:rgba(255,252,240,.5)}
  .sheet-box h4{font-variant:small-caps;color:#8e1c1c;letter-spacing:.05em;border-bottom:1px solid #c9b98a;margin-bottom:8px;padding-bottom:3px}
  .sheet-abilities{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;text-align:center;margin:10px 0}
  .sheet-ab{border:1.5px solid #8a6d1f;border-radius:6px;padding:8px 2px;background:rgba(255,252,240,.6)}
  .sheet-ab .sa-name{font-size:.7rem;font-variant:small-caps;letter-spacing:.06em;color:#8e1c1c}
  .sheet-ab .sa-mod{font-size:1.45rem;font-weight:bold}
  .sheet-ab .sa-score{font-size:.8rem;color:#6b5a35}
  .sheet .combat-row{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}
  .combat-stat{text-align:center;border:1.5px solid #8a6d1f;border-radius:6px;padding:8px 16px;background:rgba(255,252,240,.6);min-width:88px}
  .combat-stat .cs-val{font-size:1.5rem;font-weight:bold}
  .combat-stat .cs-label{font-size:.7rem;font-variant:small-caps;color:#8e1c1c;letter-spacing:.05em}
  .sheet ul{padding-left:18px;font-size:.92rem}
  .sheet li{margin:3px 0}
  .sheet .feature-name{font-weight:bold;color:#5b4310}
  .skill-line{display:flex;justify-content:space-between;font-size:.9rem;padding:1px 0}
  .skill-line.prof{font-weight:bold;color:#2a1f10}
  .skill-line.prof::before{content:"● ";color:#8e1c1c}
  .skill-line:not(.prof)::before{content:"○ ";color:#a89a70}
  .incomplete-warn{
    background:rgba(142,28,28,.12);border:1px solid var(--blood-bright);color:#f0c9c9;
    border-radius:6px;padding:12px 16px;margin-bottom:14px;
  }
  .incomplete-warn ul{padding-left:20px}

  /* ============ DICE ROLLER ============ */
  #dice-toggle{
    position:fixed;bottom:22px;right:22px;z-index:200;width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #4a3512, #1c150e 75%);
    border:2px solid var(--gold);color:var(--gold-bright);font-size:1.6rem;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.7), 0 0 18px rgba(201,162,39,.25);
    display:flex;align-items:center;justify-content:center;transition:transform .2s;
    font-family:var(--serif);
  }
  #dice-toggle:hover{transform:scale(1.08) rotate(12deg)}
  #dice-tray{
    position:fixed;bottom:98px;right:22px;z-index:199;width:min(360px, calc(100vw - 34px));
    background:linear-gradient(180deg,var(--bg-panel2),var(--bg-panel));
    border:1px solid var(--border-gold);border-radius:10px;box-shadow:var(--shadow);
    padding:16px;display:none;
  }
  #dice-tray.open{display:block;animation:fadeUp .25s ease}
  #dice-tray h3{font-variant:small-caps;color:var(--gold);letter-spacing:.06em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
  .die-btns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
  .die-btn{
    font-family:var(--serif);background:var(--bg-card);border:1px solid var(--border-dim);color:var(--ink);
    border-radius:6px;padding:9px 0;cursor:pointer;font-size:.95rem;transition:all .15s;
  }
  .die-btn:hover{border-color:var(--gold);color:var(--gold-bright);transform:translateY(-1px)}
  .dice-opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:.88rem;color:var(--ink-dim)}
  .dice-opts input[type=number]{
    width:56px;background:#191208;color:var(--ink);border:1px solid var(--border-dim);border-radius:4px;
    padding:4px 6px;font-family:var(--serif);text-align:center;
  }
  .dice-opts label{display:flex;align-items:center;gap:4px;cursor:pointer}
  .dice-opts input[type=radio]{accent-color:var(--gold)}
  #dice-result{
    text-align:center;min-height:66px;display:flex;flex-direction:column;justify-content:center;
    background:rgba(0,0,0,.3);border:1px solid var(--border-dim);border-radius:8px;padding:8px;margin-bottom:10px;
  }
  #dice-result .total{font-size:2rem;color:var(--gold-bright);text-shadow:0 0 14px rgba(255,215,94,.35)}
  #dice-result .breakdown{font-size:.82rem;color:var(--ink-dim)}
  #dice-result .crit{color:var(--ok);font-variant:small-caps;letter-spacing:.08em}
  #dice-result .fumble{color:var(--blood-bright);font-variant:small-caps;letter-spacing:.08em}
  #dice-result.rolling .total{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-4px) rotate(-3deg)}40%{transform:translateX(4px) rotate(3deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  #dice-log{max-height:140px;overflow-y:auto;font-size:.8rem;color:var(--ink-dim);border-top:1px solid var(--border-dim);padding-top:8px}
  #dice-log .log-entry{padding:2px 0;border-bottom:1px dotted rgba(74,58,28,.5)}
  #dice-log .log-entry b{color:var(--ink)}

  /* ============ DRAG & DROP DICE ============ */
  .roll-pool{padding-bottom:16px}
  .rolled-die{cursor:grab;user-select:none;position:relative}
  .rolled-die:active{cursor:grabbing}
  .rolled-die.assigned{opacity:.5;border-style:dashed}
  .rolled-die.dragging{opacity:.25}
  .rolled-die .assigned-to{position:absolute;bottom:-16px;left:0;right:0;font-size:.62rem;color:var(--ok);text-align:center;font-variant:small-caps;letter-spacing:.04em}
  .ability-box.drop-ok{border-color:var(--gold-bright);box-shadow:0 0 16px rgba(255,215,94,.4);transform:scale(1.03)}

  /* ============ CHARACTER ART ============ */
  .art-drop{border:2px dashed var(--border-gold);border-radius:8px;padding:20px;text-align:center;color:var(--ink-dim);cursor:pointer;transition:all .2s;margin-top:8px}
  .art-drop:hover{border-color:var(--gold);color:var(--ink);background:rgba(201,162,39,.04)}
  .art-drop img{max-width:100%;max-height:300px;border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .sheet-art{border:1.5px solid #8a6d1f;border-radius:6px;background:rgba(255,252,240,.6);display:flex;align-items:center;justify-content:center;min-height:430px;grid-column:1/-1;padding:10px}
  .sheet-art img{max-width:100%;max-height:470px;border-radius:4px}

  /* ============ ATTACKS & SHEET EXTRAS ============ */
  .combat-stat .cs-sub{font-size:.66rem;color:#6b5a35;margin-top:2px;white-space:nowrap}
  .atk-line{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;padding:4px 0;border-bottom:1px dotted #c9b98a}
  .atk-line small{color:#6b5a35}
  .sheet details.drill{background:transparent;border-color:#8a6d1f}
  .sheet details.drill>summary{color:#5b4310}
  .sheet details.drill>summary::before{color:#8e1c1c}
  .sheet .trait{border-left-color:#c9b98a}
  .sheet .trait b{color:#8e1c1c}
  .sheet .trait .t-desc{color:#4a3c22}

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:var(--bg-deep)}
  ::-webkit-scrollbar-thumb{background:var(--border-dim);border-radius:5px}
  ::-webkit-scrollbar-thumb:hover{background:var(--border-gold)}

  @media print{
    @page{margin:12mm}
    /* Most sheet type is sized in rem, so shrinking the root shrinks the whole
       sheet proportionally instead of each rule needing its own print size. */
    html{font-size:11px}
    body{background:#fff;color:#000;font-size:8.6pt;line-height:1.35}
    #app{max-width:none;margin:0;padding:0}
    #app>*:not(#step-summary){display:none!important}
    #step-summary{display:block!important}
    #dice-toggle,#dice-tray,.step-footer,nav.steps,.no-print{display:none!important}

    .sheet{box-shadow:none;border:none;background:#fff;color:#000;padding:0;border-radius:0}
    .sheet h2{font-size:15pt;padding-bottom:3px;margin-bottom:2px}
    .sheet .id-line{font-size:8.4pt;margin:2px 0 8px}
    .sheet-box h4{font-size:8.8pt;margin-bottom:4px;padding-bottom:2px}
    .sheet-box{padding:6px 8px;background:none;border-width:1px}

    /* A printed page is far narrower than a desktop window: two columns keeps
       the text from being squeezed into unreadable slivers. */
    .sheet-grid{grid-template-columns:1fr 1fr;gap:8px}
    .sheet-stack{gap:8px}
    .sheet-box.span2{grid-column:span 2}
    /* Keep short boxes whole across a page break; Features is far too tall to
       hold together, so let it flow and protect its individual entries. */
    .sheet-box,.sheet-stack{break-inside:avoid;page-break-inside:avoid}
    .sheet-box.span2{break-inside:auto;page-break-inside:auto}
    .sheet-box li,.sheet .trait,.atk-line{break-inside:avoid;page-break-inside:avoid}

    .sheet-abilities{gap:5px;margin:6px 0}
    .sheet-ab{padding:4px 2px;background:none}
    .sheet-ab .sa-mod{font-size:12pt}
    .combat-row{gap:6px;margin:6px 0}
    .combat-stat{padding:4px 9px;min-width:0;background:none}
    .combat-stat .cs-val{font-size:11pt}
    .sheet ul{padding-left:14px;font-size:8.4pt}
    .sheet li{margin:1px 0}
    .skill-line,.atk-line{font-size:8.2pt;padding:0}
    .sheet .trait{margin:3px 0;padding-left:8px}

    /* A half-page portrait, not a full page of it */
    .sheet-art{min-height:0;padding:0;border:none;background:none}
    .sheet-art img{max-height:95mm;width:auto}
  }
  /* screen-only: this block follows @media print, so without the `screen`
     qualifier a narrow paper size would override the print grid */
  @media screen and (max-width:640px){
    .sheet-abilities{grid-template-columns:repeat(3,1fr)}
    .panel{padding:18px 14px}
    /* below this width the grid is a single column, where a 2-column span
       would create a phantom second column and overflow the page */
    .sheet-box.span2{grid-column:auto}
  }
</style>

/* Phrases in equipment text that stand for a weapon of the player's choice */

function characterWeapons(){
  if(!S.klass) return [];
  const c=CLASSES[S.klass];
  const sources=[...Object.values(S.equip),...c.fixedEquip];
  const found=new Map();
  for(const raw of sources){
    const src=raw.toLowerCase();
    let matched=false;
    for(const name in WEAPONS){
      if(name==="Unarmed strike") continue;
      const re=new RegExp("\\b"+name.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"e?s?\\b");
      if(re.test(src)){ if(!found.has(name)) found.set(name,""); matched=true; }
    }
    if(!matched) for(const [phrase,def] of GENERIC_WEAPONS){
      if(src.includes(phrase) && !found.has(def)){ found.set(def," <small>(example pick)</small>"); break; }
    }
  }
  found.set("Unarmed strike","");
  return [...found.entries()];
}
function attackLine(name){
  const f=finalScores(), w=WEAPONS[name], pb=profBonus();
  const monkish=S.klass==="Monk"&&(w.monk||name==="Unarmed strike");
  let abil="str";
  if(w.ranged) abil="dex";
  else if((w.finesse||monkish)&&mod(f.dex)>mod(f.str)) abil="dex";
  let hit=pb+mod(f[abil]), dmgBonus=mod(f[abil]);
  const style=S.klass==="Fighter"?(S.classChoices.style||""):"";
  if(style.startsWith("Archery")&&w.ranged) hit+=2;
  if(style.startsWith("Dueling")&&!w.ranged&&!w.two) dmgBonus+=2;
  let die=w.dmg;
  if(name==="Unarmed strike") die=monkish?"1d4":"1";
  const dmg=(die==="1"?Math.max(1,1+dmgBonus):die+(dmgBonus?" "+fmtMod(dmgBonus):""))+" "+w.type;
  return {hit,dmg,props:w.props,abil};
}

const SLOTS_HALF_UP = (()=>{ const t={}; for(let L=1;L<=20;L++) t[L]=SLOTS_HALF[Math.min(20,L+1)]||[]; return t; })();

function xpForLevel(L){ return XP_THRESHOLDS[Math.max(1,Math.min(MAX_LEVEL,L))]; }
function levelForXP(xp){
  let L=1;
  for(let i=1;i<=MAX_LEVEL;i++) if(xp>=XP_THRESHOLDS[i]) L=i;
  return L;
}
function prog(){ return (S.klass && CLASSES[S.klass] && CLASSES[S.klass].progression) || null; }
function casterType(){ const p=prog(); return p?p.casterType:"none"; }

function slotTable(){
  const p=prog(); if(!p) return [];
  const L=S.level;
  switch(p.casterType){
    case "full": return SLOTS_FULL[L]||[];
    case "half": return (S.klass==="Artificer"?SLOTS_HALF_UP[L]:SLOTS_HALF[L])||[];
    case "third": return SLOTS_THIRD[L]||[];
    default: return [];
  }
}
function pactSlots(){ return casterType()==="pact" ? (SLOTS_PACT[S.level]||[0,0]) : null; }
/* Highest spell level this character can cast */
function maxSpellLevel(){
  if(casterType()==="pact"){ const ps=pactSlots(); return ps?ps[1]:0; }
  const t=slotTable();
  return t.length;
}
/* Look up a stepped table like {1:2,4:3,10:4} for the current level */
function steppedAt(table, L){
  if(!table) return 0;
  let val=0;
  Object.keys(table).map(Number).sort((a,b)=>a-b).forEach(k=>{ if(k<=L) val=table[k]; });
  return val;
}
function cantripsKnownAt(){
  const p=prog();
  if(p && p.cantripsKnown) return steppedAt(p.cantripsKnown, S.level);
  const sc=S.klass&&CLASSES[S.klass].spellcasting;
  return sc?sc.cantrips:0;
}
/* Total number of spells the character knows / prepares / has in a spellbook */
function spellBudget(){
  const p=prog(), sc=S.klass&&CLASSES[S.klass].spellcasting;
  if(!sc) return 0;
  if(p && p.spellsKnown) return steppedAt(p.spellsKnown, S.level);
  if(sc.mode==="book") return 6+(S.level-1)*2;                    // wizard spellbook
  if(sc.mode==="prepared"){
    const abilMod=mod(finalScores()[sc.ability]);
    const divisor=(p&&p.casterType==="half")?2:1;
    return Math.max(1, abilMod+Math.floor(S.level/divisor));
  }
  if(sc.mode==="known") return sc.known||0;
  return 0;
}
function profBonus(){ return 2+Math.floor((S.level-1)/4); }

/* ---------- subclass ---------- */
function subclassInfo(){ return S.klass?SUBCLASSES[S.klass]:null; }
function subclassUnlocked(){
  const si=subclassInfo(); const p=prog();
  const lvl=si?si.level:(p?p.subclassLevel:99);
  return S.level>=lvl;
}
function currentSubclass(){
  const si=subclassInfo();
  return (si && S.subclass && si.options[S.subclass]) ? si.options[S.subclass] : null;
}

/* ---------- ability score improvements & feats ---------- */
function asiLevels(){ const p=prog(); return p?(p.asiLevels||[]):[]; }
function availableASIs(){ return asiLevels().filter(L=>L<=S.level); }
function asiBonus(){
  const b={str:0,dex:0,con:0,int:0,wis:0,cha:0};
  for(const L of availableASIs()){
    const pick=S.asiPicks[L];
    if(!pick) continue;
    if(pick.mode==="asi"){
      if(pick.a1&&b[pick.a1]!==undefined) b[pick.a1]++;
      if(pick.a2&&b[pick.a2]!==undefined) b[pick.a2]++;
    } else if(pick.mode==="feat" && pick.feat && FEATS[pick.feat]){
      const fa=FEATS[pick.feat].asi;
      if(typeof fa==="string" && b[fa]!==undefined) b[fa]++;
      else if(Array.isArray(fa) && pick.featAbil && b[pick.featAbil]!==undefined) b[pick.featAbil]++;
    }
  }
  return b;
}
function chosenFeats(){
  return availableASIs().map(L=>S.asiPicks[L]).filter(p=>p&&p.mode==="feat"&&p.feat).map(p=>p.feat);
}

/* ---------- features gained across all levels ---------- */
function allFeatures(){
  const out=[];   // {lvl, n, d, src}
  if(!S.klass) return out;
  const c=CLASSES[S.klass];
  (c.features||[]).forEach(f=>out.push({lvl:1,n:f.n,d:f.d,src:S.klass}));
  const p=prog();
  if(p && p.featuresByLevel){
    Object.keys(p.featuresByLevel).map(Number).sort((a,b)=>a-b).forEach(L=>{
      if(L<=S.level) p.featuresByLevel[L].forEach(f=>out.push({lvl:L,n:f.n,d:f.d,src:S.klass}));
    });
  }
  const sub=currentSubclass();
  if(sub && sub.features){
    Object.keys(sub.features).map(Number).sort((a,b)=>a-b).forEach(L=>{
      if(L<=S.level) sub.features[L].forEach(f=>out.push({lvl:L,n:f.n,d:f.d,src:S.subclass}));
    });
  }
  return out.sort((a,b)=>a.lvl-b.lvl);
}

/* ---------- hit points ---------- */
function hpPerLevelBonus(){
  let b=0;
  if(S.race==="Dwarf (Hill)") b+=1;
  if(S.klass==="Sorcerer" && S.subclass==="Draconic Bloodline") b+=1;
  if(chosenFeats().includes("Tough")) b+=2;
  return b;
}
function computeHP(){
  if(!S.klass) return null;
  const die=CLASSES[S.klass].hitDie;
  const conMod=mod(finalScores().con);
  const per=hpPerLevelBonus();
  let hp=die+conMod+per;                              // level 1: max hit die
  const avg=Math.floor(die/2)+1;
  for(let L=2;L<=S.level;L++){
    const rolled=S.hpRolls[L-2];
    hp+=(S.hpMode==="rolled"&&rolled?rolled:avg)+conMod+per;
  }
  return Math.max(S.level, hp);
}
function rollHitDice(){
  const die=CLASSES[S.klass].hitDie;
  S.hpRolls=[];
  for(let L=2;L<=S.level;L++) S.hpRolls.push(1+Math.floor(Math.random()*die));
}
</script>

/* =====================================================================
   INTEGRATION — merge expansion data into the core tables
===================================================================== */
/* Additional armor types used by the expanded classes */
Object.assign(ARMOR,{

  "Firbolg":{height:[84,96],weight:[240,340],hair:["Moss green","Russet","Wheat blond","Bark brown"],eyes:["Forest green","Amber","Blue","Warm brown"],skin:["Pale blue-gray","Ruddy","Birch pale","Loam brown"]},
  "Lizardfolk":{height:[60,76],weight:[140,260],hair:["None — smooth scales","None — dorsal frill","None — horned crest"],eyes:["Yellow","Orange","Green","Black slit-pupiled"],skin:["Green scales","Brown scales","Gray scales","Mottled swamp green","Sandy tan scales"]},
  "Kobold":{height:[36,48],weight:[35,60],hair:["None — scaled","None — small crest"],eyes:["Red","Orange","Black","Yellow"],skin:["Rust red scales","Sandy brown scales","Black scales","Green scales","White scales"]},
  "Warforged":{height:[68,86],weight:[240,340],hair:["None — plated crown","Cable filaments","Etched sigils"],eyes:["Glowing blue","Amber lenses","Green crystal","Dim white"],skin:["Darkwood and iron","Brass plating","Stone composite","Blackened steel","Copper filigree"]},
  "Goblin":{height:[36,48],weight:[35,60],hair:["Black","Dark brown","Wiry red","None"],eyes:["Red","Yellow","Orange","Black"],skin:["Green","Yellow-green","Gray-green","Olive"]}
});

/* Subclasses: SRD twelve plus any supplied by the expansion classes */
var SUBCLASSES = {};
if(typeof SUBCLASSES_SRD!=="undefined") Object.assign(SUBCLASSES,SUBCLASSES_SRD);
if(typeof SUBCLASSES_NEW!=="undefined") Object.assign(SUBCLASSES,SUBCLASSES_NEW);

/* Level 2-20 progression for the twelve core classes */
if(typeof PROGRESSION_SRD!=="undefined"){
  for(const k in PROGRESSION_SRD){ if(CLASSES[k]) CLASSES[k].progression=PROGRESSION_SRD[k]; }
}
/* Any class still lacking a progression gets a safe default so the UI never breaks */
for(const k in CLASSES){
  if(!CLASSES[k].progression){
    CLASSES[k].progression={casterType:CLASSES[k].spellcasting?"full":"none",subclassLevel:3,
      subclassLabel:"Subclass",asiLevels:[4,8,12,16,19],featuresByLevel:{}};
  }
}
/* Derive each class's subclass level/label from its subclass table when present */
for(const k in SUBCLASSES){
  if(CLASSES[k]){
    CLASSES[k].progression.subclassLevel=SUBCLASSES[k].level;
    CLASSES[k].progression.subclassLabel=SUBCLASSES[k].label;
  }
}

/* Higher-level spells */
if(typeof SPELLS_HI!=="undefined") Object.assign(SPELLS,SPELLS_HI);
if(typeof SPELL_META_HI!=="undefined") Object.assign(SPELL_META,SPELL_META_HI);
if(typeof CLASS_SPELLS_HI!=="undefined"){
  for(const cls in CLASS_SPELLS_HI){
    if(!CLASS_SPELLS[cls]) CLASS_SPELLS[cls]={cantrips:[],level1:[]};
    for(const lvl in CLASS_SPELLS_HI[cls]) CLASS_SPELLS[cls]["level"+lvl]=CLASS_SPELLS_HI[cls][lvl];
  }
}
/* Expansion caster classes that have no bespoke list borrow a thematic one */
const BORROWED_LISTS={Artificer:"Wizard",Psion:"Sorcerer",Shaman:"Druid",Spellblade:"Wizard",
  Necromancer:"Wizard",Alchemist:"Druid",Warden:"Druid","Blood Hunter":"Warlock"};
for(const cls in BORROWED_LISTS){
  const src=CLASS_SPELLS[BORROWED_LISTS[cls]];
  if(!src) continue;
  if(!CLASS_SPELLS[cls]) CLASS_SPELLS[cls]={};
  // an existing-but-empty array must still be filled, so test length rather than truthiness
  for(const key in src){
    const cur=CLASS_SPELLS[cls][key];
    if(!cur || !cur.length) CLASS_SPELLS[cls][key]=src[key];
  }
}
/* Fall back to a safe empty list for any caster class with no spell list at all */
for(const k in CLASSES){
  const sc=CLASSES[k].spellcasting;
  if(sc && !CLASS_SPELLS[sc.listKey]) CLASS_SPELLS[sc.listKey]={cantrips:[],level1:[]};
}

/* Subclass-gated features that used to live on the base SRD class */
if(CLASSES.Cleric) CLASSES.Cleric.features=CLASSES.Cleric.features.filter(f=>!/^Divine Domain|^Disciple of Life/.test(f.n));
if(CLASSES.Sorcerer){
  CLASSES.Sorcerer.features=CLASSES.Sorcerer.features.filter(f=>!/^Draconic/.test(f.n));
  delete CLASSES.Sorcerer.choices;
}

/* Every spell the class list can reach, grouped by spell level */
function spellsByLevel(){
  const sc=S.klass&&CLASSES[S.klass].spellcasting;
  if(!sc) return {};
  const list=CLASS_SPELLS[sc.listKey]||{};
  const out={};
  const maxL=maxSpellLevel();
  for(let L=1;L<=maxL;L++){
    const arr=list["level"+L]||[];
    const valid=arr.filter(n=>SPELLS[n]);
    if(valid.length) out[L]=valid;
  }
  return out;
}
function autoSpells(){
  return (S.klass==="Cleric" && S.subclass==="Life Domain") ? ["Bless","Cure Wounds"] : [];
}

<script>
/* =====================================================================
   STEP: ADVANCEMENT — level, XP, hit points, subclass, ASIs & feats
===================================================================== */
function renderAdvancement(){
  if(!S.klass){
    $("step-advancement").innerHTML='<div class="panel"><h2><span class="ornament">✦</span> Advancement</h2>'
      +'<div class="rules-note">Choose a <b>base class</b> first — everything about advancement flows from it.</div>'

    return;
  }
  const c=CLASSES[S.klass], p=prog(), f=finalScores();

  /* --- level & experience --- */
  const nextXP=S.level<MAX_LEVEL?xpForLevel(S.level+1):null;
  const levelUI='<div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center">'

    +'<div><div style="font-variant:small-caps;color:var(--ink-dim)">Proficiency Bonus</div>'
    +'<div style="font-size:2rem;color:var(--gold-bright);line-height:1.2">+'+profBonus()+'</div></div>'
    +'</div>';

  /* --- hit points --- */
  const die=c.hitDie, avg=Math.floor(die/2)+1;
  const hpUI='<h3 style="color:var(--gold);font-variant:small-caps;margin-top:18px">Hit Points</h3>'
    +'<div class="rules-note">At 1st level you gain the maximum roll (<b>'+die+'</b>) plus your Constitution modifier. Each level after grants either the fixed average (<b>'+avg+'</b>) or a fresh <b>d'+die+'</b> roll, plus your Constitution modifier again.</div>'

    +'<label class="pick-item" style="max-width:230px"><input type="radio" name="hpmode" data-hpmode="rolled"'+(S.hpMode==="rolled"?" checked":"")+'><span><span class="pi-name">Roll each level</span><span class="pi-sub">Cast a d'+die+' for every level after the first</span></span></label>'
    +(S.hpMode==="rolled"?'<button class="btn gold" data-act="roll-hp">🎲 Roll hit dice</button>':'')
    +'</div>'
    +(S.hpMode==="rolled"&&S.hpRolls.length?'<div class="roll-pool" style="padding-bottom:4px">'+S.hpRolls.slice(0,S.level-1).map((v,i)=>'<div class="rolled-die" style="cursor:default" title="Level '+(i+2)+'">'+v+'</div>').join('')+'</div>':'')
    +'<div class="rules-note" style="margin-top:10px">Total Hit Points: <b style="font-size:1.3rem">'+computeHP()+'</b> '
    +'<span style="font-size:.85rem">(d'+die+' hit die, Constitution '+fmtMod(mod(f.con))+' per level'+(hpPerLevelBonus()?', '+fmtMod(hpPerLevelBonus())+' per level from traits':'')+')</span></div>';

  /* --- subclass --- */
  let subUI="";
  const si=subclassInfo();
  if(si){
    if(!subclassUnlocked()){
      subUI='<h3 style="color:var(--gold);font-variant:small-caps;margin-top:18px">'+si.label+'</h3>'
        +'<div class="rules-note">You choose your '+si.label+' at <b>level '+si.level+'</b>. Raise your level to unlock it.</div>';
    } else {
      const cards=Object.entries(si.options).map(([k,o])=>
        '<div class="choice-card'+(S.subclass===k?' selected':'')+'" data-pick-sub="'+k+'">'

      let sd="";
      const sub=currentSubclass();
      if(sub){
        const lvls=Object.keys(sub.features).map(Number).sort((a,b)=>a-b);
        sd='<div class="detail-pane"><h3>'+S.subclass+'</h3><div class="flavor">'+sub.flavor+'</div>'
          +lvls.map(L=>drill((L<=S.level?"✦ ":"🔒 ")+"Level "+L+(L<=S.level?"":" — not yet reached"),
              traitList(sub.features[L]), L<=S.level, "subfeat-L"+L)).join('')
          +'</div>';
      }
      subUI='<h3 style="color:var(--gold);font-variant:small-caps;margin-top:18px">'+si.label+'</h3>'

    }
  }

  /* --- ability score improvements & feats --- */
  let asiUI="";
  const avail=availableASIs(), all=asiLevels();
  if(all.length){
    const rows=avail.map(L=>{
      const pick=S.asiPicks[L]||{mode:"asi",a1:"",a2:""};

          +(Array.isArray(FEATS[pick.feat].asi)

              +FEATS[pick.feat].asi.map(a=>'<option value="'+a+'"'+(pick.featAbil===a?' selected':'')+'>'+ABILITY_INFO[a].name+'</option>').join('')+'</select></div>'
            : (typeof FEATS[pick.feat].asi==="string"?'<div style="margin-top:4px;color:var(--ok);font-size:.85rem">Also grants +1 '+ABILITY_INFO[FEATS[pick.feat].asi].name+'</div>':''))
        : "";
      return '<div style="border:1px solid var(--border-dim);border-radius:6px;padding:12px 14px;margin:8px 0;background:rgba(0,0,0,.2)">'
        +'<b style="color:var(--gold);font-variant:small-caps;letter-spacing:.05em">Level '+L+'</b>'
        +'<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;align-items:center">'
        +'<label style="display:flex;gap:5px;align-items:center;cursor:pointer"><input type="radio" name="asimode'+L+'" data-asi-mode="'+L+'" value="asi"'+(pick.mode!=="feat"?" checked":"")+' style="accent-color:var(--gold)"> Ability Score Improvement</label>'
        +'<label style="display:flex;gap:5px;align-items:center;cursor:pointer"><input type="radio" name="asimode'+L+'" data-asi-mode="'+L+'" value="feat"'+(pick.mode==="feat"?" checked":"")+' style="accent-color:var(--gold)"> Take a Feat</label>'
        +'</div>'
        +'<div style="margin-top:8px">'
        +(pick.mode==="feat" ? featOpts+featInfo
          : '<span style="color:var(--ink-dim);font-size:.9rem">Raise two abilities by 1 each, or pick the same twice for +2 (maximum 20): </span><br>'+abilSel(1,pick.a1)+' '+abilSel(2,pick.a2))
        +'</div></div>';
    }).join('');
    const upcoming=all.filter(L=>L>S.level);
    asiUI='<h3 style="color:var(--gold);font-variant:small-caps;margin-top:18px">Ability Score Improvements &amp; Feats</h3>'
      +'<div class="rules-note">'+S.klass+' gains an improvement at levels <b>'+all.join(", ")+'</b>. Each may be spent on +2 to one ability, +1 to two abilities, or a feat. No ability may exceed 20.</div>'
      +(rows||'<div style="color:var(--ink-dim);font-style:italic">None yet — your first comes at level '+all[0]+'.</div>')
      +(upcoming.length?'<div style="color:var(--ink-dim);font-size:.88rem;margin-top:6px">Still to come at level '+upcoming.join(", ")+'.</div>':'');
  }

  /* --- features gained --- */
  const feats=allFeatures();
  const byLevel={};
  feats.forEach(ft=>{ (byLevel[ft.lvl]=byLevel[ft.lvl]||[]).push(ft); });
  const featureUI='<h3 style="color:var(--gold);font-variant:small-caps;margin-top:18px">Features Gained (levels 1–'+S.level+')</h3>'
    +Object.keys(byLevel).map(Number).sort((a,b)=>a-b).map(L=>
      drill("Level "+L+" <span class='lvl-tag'>"+byLevel[L].length+"</span>",
        traitList(byLevel[L].map(ft=>({n:ft.n+" <i style='color:var(--ink-dim);font-weight:normal'>("+ft.src+")</i>",d:ft.d}))), L===S.level, "features-L"+L)).join('');

  /* --- spell slots --- */
  let slotUI="";
  if(casterType()!=="none"){
    if(casterType()==="pact"){
      const ps=pactSlots();
      slotUI='<h3 style="color:var(--gold);font-variant:small-caps;margin-top:18px">Pact Magic</h3>'
        +'<div class="rules-note"><b>'+ps[0]+'</b> spell slot'+(ps[0]===1?"":"s")+' of <b>level '+ps[1]+'</b>, all regained on a short or long rest.</div>';
    } else {
      const t=slotTable();
      slotUI='<h3 style="color:var(--gold);font-variant:small-caps;margin-top:18px">Spell Slots</h3>'
        +(t.length?'<div class="stat-chips">'+t.map((n,i)=>'<span class="chip"><b>Level '+(i+1)+':</b> '+n+' slot'+(n===1?"":"s")+'</span>').join('')+'</div>'
          :'<div class="rules-note">No spell slots at this level yet.</div>');
    }
  }

  $("step-advancement").innerHTML=
    '<div class="panel"><h2><span class="ornament">✦</span> Advancement</h2>'
    +'<p class="lede">Set your level and experience, then spend everything your class grants along the way — hit points, a subclass, skill proficiencies, spell slots and spells, ability improvements, and feats.</p>'
    +levelUI+hpUI+subUI+skillPickerUI()+slotUI+spellPickerUI()+asiUI+featureUI
    +'<div class="step-footer"><button class="btn" data-goto="2">◂ Base Class</button><button class="btn gold" data-goto="4">Background ▸</button></div>'
    +'</div>';
}
</script>

<script>
/* =====================================================================
   APPLICATION STATE & ENGINE
===================================================================== */
const S = {
  step:0,
  rolled:[],
  assigned:{str:"",dex:"",con:"",int:"",wis:"",cha:""},   // rolled-die index per ability
  body:{hair:"",eyes:"",skin:"",height:"",weight:"",notes:""},
  art:null,
  halfElf:["",""],
  race:null, raceChoices:{},
  klass:null, classChoices:{}, skills:[], cantrips:[], spells1:[],
  level:1, xp:0, subclass:null, asiPicks:{}, hpMode:"average", hpRolls:[],
  background:null,
  equip:{}, armor:null, shield:false, items:[],
  name:"", alignment:"", persona:{traits:"",ideals:"",bonds:"",flaws:""}
};

const STEPS = [
  {id:"abilities",title:"I. Abilities"},
  {id:"race",title:"II. Race"},
  {id:"class",title:"III. Base Class"},
  {id:"advancement",title:"IV. Advancement"},
  {id:"background",title:"V. Background"},
  {id:"equipment",title:"VI. Equipment"},
  {id:"details",title:"VII. Details"},
  {id:"summary",title:"VIII. Character Sheet"}
];

/* ---------- derived values ---------- */
function baseScores(){
  const out={};
  for(const a of ABILITIES){
    const i=S.assigned[a];
    out[a]=(i===""||i==null)?0:(S.rolled[+i]||0);
  }
  return out;
}
function racialBonus(){
  const b={str:0,dex:0,con:0,int:0,wis:0,cha:0};
  if(S.race && RACES[S.race]){
    const r=RACES[S.race];
    for(const k in (r.asi||{})) b[k]+=r.asi[k];
    if(r.asiChoice) for(const k of S.halfElf) if(k) b[k]+=r.asiChoice.amount;
  }
  return b;
}
function finalScores(){
  const base=baseScores(), rb=racialBonus();
  const ab=(typeof asiBonus==="function")?asiBonus():{str:0,dex:0,con:0,int:0,wis:0,cha:0};
  const out={};
  for(const a of ABILITIES) out[a]=Math.min(20,(base[a]||0)+rb[a]+(ab[a]||0));
  return out;
}
function abilitiesDone(){
  return S.rolled.length===6 && ABILITIES.every(a=>S.assigned[a]!==""&&S.assigned[a]!=null);
}
function grantedSkills(){
  const g=new Set();
  if(S.background) BACKGROUNDS[S.background].skills.forEach(s=>g.add(s));
  // Any racial trait that grants a named skill proficiency
  if(S.race && RACES[S.race]){
    RACES[S.race].traits.forEach(t=>{
      Object.keys(SKILLS).forEach(sk=>{
        if(new RegExp("proficien\\w*\\s+(?:in|with)\\s+the\\s+"+sk+"\\s+skill","i").test(t.d)) g.add(sk);
      });
    });
  }
  return g;
}
function skillBudget(){
  if(!S.klass) return {classCount:0, anyCount:0};
  return {classCount:CLASSES[S.klass].skills.count, anyCount:(S.race==="Half-Elf"?2:0)};
}

function computeAC(){
  const f=finalScores();
  let armorKey=S.armor;
  if(!armorKey && S.klass) armorKey=CLASSES[S.klass].armorOptions[0];
  if(!armorKey) armorKey="None";
  const a=ARMOR[armorKey]||ARMOR["None"];
  const styleBonus=(S.klass==="Fighter" && (S.classChoices.style||"").startsWith("Defense"))?1:0;
  const shieldBonus=S.shield?2:0;
  const ac=a.calc(f)+shieldBonus+styleBonus;
  // Touch AC ignores armor, shield, and natural armor; flat-footed loses Dex
  let touch=10+mod(f.dex);
  if(armorKey==="Unarmored (Monk)") touch+=mod(f.wis);
  if(armorKey==="Unarmored (Barbarian)") touch+=mod(f.con);
  const flat=Math.min(ac, a.calc(Object.assign({},f,{dex:10}))+shieldBonus+styleBonus);
  return {ac, touch, flat, armorKey, stealthDis:!!a.stealthDis};
}

/* ---------- html helpers ---------- */
const $=id=>document.getElementById(id);
function chips(arr){ return '<div class="stat-chips">'+arr.map(c=>'<span class="chip">'+c+'</span>').join('')+'</div>'; }
/* Open/closed state of every drill-down, keyed by its title, so a re-render
   does not slam shut the section the user is working in. */
const DRILL_STATE={};
function drillKey(title){ return String(title).replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim(); }
function drill(title,body,open,key){
  // an explicit key keeps the section identity stable when the summary text
  // itself changes (e.g. a "2 of 5 chosen" counter)
  const k=key||drillKey(title);
  const isOpen=(k in DRILL_STATE)?DRILL_STATE[k]:!!open;
  return '<details class="drill" data-drill="'+k.replace(/"/g,"&quot;")+'"'+(isOpen?' open':'')
    +'><summary>'+title+'</summary><div class="drill-body">'+body+'</div></details>';
}
document.addEventListener("toggle",e=>{
  const d=e.target;
  if(d.tagName==="DETAILS" && d.dataset && d.dataset.drill) DRILL_STATE[d.dataset.drill]=d.open;
},true);
function traitList(traits){
  return traits.map(t=>'<div class="trait"><b>'+t.n+'.</b> <span class="t-desc">'+t.d+'</span></div>').join('');
}

/* =====================================================================
   STEP RENDERERS
===================================================================== */
function renderNav(){
  const doneFlags=[abilitiesDone(), !!S.race, !!S.klass,
    !!(S.klass&&(!subclassUnlocked()||S.subclass)), !!S.background,
    !!(S.klass&&Object.keys(S.equip).length), !!(S.name&&S.alignment), false];
  $("step-nav").innerHTML=STEPS.map((st,i)=>
    '<button data-goto="'+i+'" class="'+(i===S.step?'active':'')+(doneFlags[i]?' done':'')+'">'+st.title+'</button>'
  ).join('');
  STEPS.forEach((st,i)=>{
    const el=$("step-"+st.id);
    el.classList.toggle("visible", i===S.step);
  });
}

/* ---------- Step 1: Abilities ---------- */
function renderAbilities(){
  const f=finalScores(), rb=racialBonus();
  const abilOfIdx=i=>ABILITIES.find(a=>S.assigned[a]!=="" && S.assigned[a]!=null && +S.assigned[a]===i);
  const diceUI=S.rolled.length
    ? S.rolled.map((v,i)=>{
        const owner=abilOfIdx(i);
        return '<div class="rolled-die'+(owner?' assigned':'')+'" draggable="true" data-die="'+i+'" title="Drag me onto an ability">'+v
          +(owner?'<div class="assigned-to">'+ABILITY_INFO[owner].name.slice(0,3)+'</div>':'')+'</div>';
      }).join('')
    : '<span style="color:var(--ink-dim);font-style:italic">No dice cast yet — roll to forge your fate…</span>';

  const boxes=ABILITIES.map(a=>{
    const info=ABILITY_INFO[a], cur=S.assigned[a];
    const opts=[];
    S.rolled.forEach((v,i)=>{
      const owner=abilOfIdx(i);
      if(!owner||owner===a) opts.push('<option value="'+i+'"'+(cur!==""&&cur!=null&&+cur===i?' selected':'')+'>'+v+'</option>');
    });
    const total=f[a], hasBase=cur!==""&&cur!=null;
    return '<div class="ability-box" data-abil="'+a+'">'
      +'<div class="ab-name">'+info.name+'</div><div class="ab-desc">'+info.desc+'</div>'
      +'<select data-assign="'+a+'"'+(S.rolled.length?'':' disabled')+'><option value="">—</option>'+opts.join('')+'</select>'
      +'<div class="ab-mod">'+(hasBase?('Score <b>'+total+'</b> · mod <b>'+fmtMod(mod(total))+'</b>'):'<span style="color:var(--ink-dim);font-size:.85rem">drop a die here</span>')+'</div>'
      +'<div class="ab-race">'+(rb[a]?('+'+rb[a]+' racial'):'')+'</div>'
      +'</div>';
  }).join('');

  $("step-abilities").innerHTML=
    '<div class="panel"><h2><span class="ornament">⚔</span> Roll Ability Scores</h2>'
    +'<p class="lede">Six abilities define every adventurer: Strength, Dexterity, Constitution, Intelligence, Wisdom, and Charisma. Your modifier is (score − 10) ÷ 2, rounded down.</p>'
    +'<div class="rules-note"><b>Rolling for scores:</b> roll 4d6 and drop the lowest die, six times. Then <b>drag each die onto the ability</b> where you want it — drop onto an occupied ability to swap. (The dropdowns work too.)</div>'
    +'<button class="btn gold" data-act="roll-abilities">🎲 Roll 4d6 (drop lowest) × 6</button>'
    +'<div class="roll-pool">'+diceUI+'</div>'
    +'<div class="ability-grid">'+boxes+'</div>'
    +(S.race?'<div class="rules-note">Racial bonuses from <b>'+S.race+'</b> are shown in green and included in the totals.</div>':'')
    +drill("📖 Rules: ability checks, saves & modifiers",
      "<p>Every d20 roll — attack, check, or saving throw — adds an ability modifier. A score of 10–11 is the human average (+0); 15 is gifted (+2); 20 the mortal maximum (+5).</p><p><b>Proficiency bonus</b> at level 1 is +2, added when you are proficient in the skill, save, or weapon being used.</p>")
    +'<div class="step-footer"><span></span><button class="btn gold" data-goto="1">Choose Race ▸</button></div>'
    +'</div>';
}

/* ---------- Step 2: Race ---------- */
function renderRace(){
  const cards=Object.entries(RACES).map(([k,r])=>{
    const asi=Object.entries(r.asi).map(([a,v])=>ABILITY_INFO[a].name.slice(0,3)+" +"+v).join(", ")+(r.asiChoice?", +1 to two others":"");
    return '<div class="choice-card'+(S.race===k?' selected':'')+'" data-pick-race="'+k+'">'
      +'<h3>'+k+'</h3><div class="tagline">'+r.tagline+'</div>'
      +'<div class="statline">'+asi+'<br><span>'+r.size+' · '+r.speed+' ft. speed</span></div></div>';
  }).join('');

  let detail="";
  if(S.race){
    const r=RACES[S.race];
    let extra="";
    if(r.asiChoice){
      const opts=ABILITIES.filter(a=>!(a in r.asi));
      extra='<div class="rules-note"><b>Skill Versatility &amp; flexible bonuses:</b> choose two different abilities to increase by 1.</div>'
        +[0,1].map(i=>'<select data-halfelf="'+i+'" style="margin:4px 8px 4px 0;background:#191208;color:var(--ink);border:1px solid var(--border-gold);border-radius:4px;padding:5px;font-family:var(--serif)"><option value="">— choose ability —</option>'
          +opts.map(a=>'<option value="'+a+'"'+(S.halfElf[i]===a?' selected':'')+(S.halfElf[1-i]===a?' disabled':'')+'>'+ABILITY_INFO[a].name+'</option>').join('')+'</select>').join('');
    }
    if(r.choices){
      extra+=r.choices.map(c=>'<div style="margin:8px 0"><b style="color:var(--gold);font-variant:small-caps">'+c.label+':</b> '
        +'<select data-racechoice="'+c.id+'" style="background:#191208;color:var(--ink);border:1px solid var(--border-gold);border-radius:4px;padding:5px;font-family:var(--serif);max-width:100%"><option value="">— choose —</option>'
        +c.options.map(o=>'<option'+(S.raceChoices[c.id]===o?' selected':'')+'>'+o+'</option>').join('')+'</select></div>').join('');
    }
    detail='<div class="detail-pane"><h3>'+S.race+'</h3><div class="flavor">'+r.flavor+'</div>'
      +chips(['<b>Size:</b> '+r.size,'<b>Speed:</b> '+r.speed+' ft.','<b>Languages:</b> '+r.languages.join(", ")])
      +extra
      +drill("Racial Traits — full details", traitList(r.traits), true)
      +'</div>';
  }

  $("step-race").innerHTML=
    '<div class="panel"><h2><span class="ornament">🛡</span> Choose Your Race</h2>'
    +'<p class="lede">Your character’s race grants ability score increases, senses, and inborn talents. Click a card to read its full traits.</p>'
    +'<div class="card-grid">'+cards+'</div>'+detail
    +'<div class="step-footer"><button class="btn" data-goto="0">◂ Abilities</button><button class="btn gold" data-goto="2">Choose Class ▸</button></div>'
    +'</div>';
}

/* ---------- Step 3: Class ---------- */
function renderClass(){
  const cards=Object.entries(CLASSES).map(([k,c])=>
    '<div class="choice-card'+(S.klass===k?' selected':'')+'" data-pick-class="'+k+'">'
    +'<h3>'+k+'</h3><div class="tagline">'+c.tagline+'</div>'
    +'<div class="statline">Hit die d'+c.hitDie+' · '+c.primary+'<br><span>Saves: '+c.saves.map(s=>ABILITY_INFO[s].name.slice(0,3)).join(", ")+'</span></div></div>'
  ).join('');

  let detail="";
  if(S.klass){
    const c=CLASSES[S.klass];
    let choiceUI="";
    if(c.choices){
      choiceUI=c.choices.map(ch=>'<div style="margin:8px 0"><b style="color:var(--gold);font-variant:small-caps">'+ch.label+':</b> '
        +'<select data-classchoice="'+ch.id+'" style="background:#191208;color:var(--ink);border:1px solid var(--border-gold);border-radius:4px;padding:5px;font-family:var(--serif);max-width:100%"><option value="">— choose —</option>'
        +ch.options.map(o=>'<option'+(S.classChoices[ch.id]===o?' selected':'')+'>'+o+'</option>').join('')+'</select></div>').join('');
    }

    const si=SUBCLASSES[S.klass];
    detail='<div class="detail-pane"><h3>'+S.klass+'</h3><div class="flavor">'+c.flavor+'</div>'
      +chips(['<b>Hit Die:</b> d'+c.hitDie,'<b>Primary:</b> '+c.primary,'<b>Saving Throws:</b> '+c.saves.map(s=>ABILITY_INFO[s].name).join(", "),'<b>Armor:</b> '+c.armorProf,'<b>Weapons:</b> '+c.weaponProf,'<b>Tools:</b> '+c.toolProf])
      +choiceUI
      +drill("Level 1 Class Features — full details", traitList(c.features), true)
      +'<div class="rules-note" style="margin-top:12px">Next, in <b>Advancement</b>, you will set your level and choose your '
      +(si?si.label.toLowerCase():"subclass")+', skill proficiencies'
      +(c.spellcasting?", spell slots and spells":"")+'.</div>'
      +'</div>';
  }

  $("step-class").innerHTML=
    '<div class="panel"><h2><span class="ornament">⚜</span> Choose Your Base Class</h2>'
    +'<p class="lede">Your class is your calling — it shapes how you fight, what you master, and whether magic answers when you call. Twelve core classes and ten from the wider open canon await.</p>'
    +'<div class="card-grid">'+cards+'</div>'+detail
    +'<div class="step-footer"><button class="btn" data-goto="1">◂ Race</button><button class="btn gold" data-goto="3">Advancement ▸</button></div>'
    +'</div>';
}

/* ---------- shared pickers, used by the Advancement step ---------- */
function skillPickerUI(){
  const c=CLASSES[S.klass];
  const granted=grantedSkills(), budget=skillBudget();
  const fromClass=S.skills.filter(s=>c.skills.from.includes(s)).length;
  const fromAny=S.skills.length-fromClass;
  const classFull=fromClass>=budget.classCount, anyFull=fromAny>=budget.anyCount;
  const skillItems=Object.keys(SKILLS).map(sk=>{
    const inClass=c.skills.from.includes(sk);
    const isGranted=granted.has(sk);
    const picked=S.skills.includes(sk);
    const selectable=inClass || budget.anyCount>0;
    if(!selectable && !isGranted) return "";
    // once every allowance is spent, unpicked skills are visibly locked rather than silently inert
    const full=!picked && !isGranted && (inClass ? (classFull&&anyFull) : anyFull);
    return '<label class="pick-item'+(picked?' picked':'')+((isGranted||full)?' locked':'')+'">'
      +'<input type="checkbox" data-skill="'+sk+'"'+(picked?' checked':'')+(isGranted?' disabled checked':(full?' disabled':''))+'>'
      +'<span><span class="pi-name">'+sk+'</span><span class="pi-sub">'+ABILITY_INFO[SKILLS[sk]].name
      +(isGranted?' · already granted':inClass?'':' · via Skill Versatility')+(full?' · no picks left':'')+'</span></span></label>';
  }).join('');
  return '<h3 style="color:var(--gold);font-variant:small-caps;margin-top:18px">Skill Proficiencies</h3>'
    +'<div class="pick-counter">Choose <b>'+budget.classCount+'</b> class skills'+(budget.anyCount?' + <b>'+budget.anyCount+'</b> any skills (Half-Elf Skill Versatility)':'')
    +' — picked <b>'+fromClass+'</b>/'+budget.classCount+(budget.anyCount?' and <b>'+fromAny+'</b>/'+budget.anyCount:'')+'. Skills granted by race or background are locked in.</div>'
    +'<div class="pick-list">'+skillItems+'</div>';
}

function spellPickerUI(){
  const c=CLASSES[S.klass], sc=c.spellcasting;
  if(!sc) return "";
  const list=CLASS_SPELLS[sc.listKey]||{cantrips:[],level1:[]};
  const budget=spellBudget(), cantripMax=cantripsKnownAt(), auto=autoSpells();
  const spellsFull=S.spells1.length>=budget, cantripsFull=S.cantrips.length>=cantripMax;
  const mkItems=(names,group,picked)=>names.map(sp=>{
    const s=SPELLS[sp]; if(!s) return "";
    const isAuto=group==="spells1"&&auto.includes(sp);
    const isPicked=picked.includes(sp)||isAuto;
    const full=!isPicked&&(group==="cantrips"?cantripsFull:spellsFull);
    return '<label class="pick-item'+(isPicked?' picked':'')+((isAuto||full)?' locked':'')+'">'
      +'<input type="checkbox" data-spell="'+group+'" data-name="'+sp+'"'+(isPicked?' checked':'')+((isAuto||full)?' disabled':'')+'>'
      +'<span><span class="pi-name">'+sp+'</span><span class="pi-sub">'+s.school+(isAuto?' · always prepared (domain)':'')
      +(SPELL_META[sp]?' · '+SPELL_META[sp][0]+' · '+SPELL_META[sp][1]+' · '+SPELL_META[sp][2]+' · '+SPELL_META[sp][3]:'')
      +' — '+s.d+'</span></span></label>';
  }).join('');
  const verb = sc.mode==="prepared" ? "prepare" : sc.mode==="book" ? "record in your spellbook" : "know";
  const modeNote = sc.mode==="prepared" ? (sc.prepNote||"")+" At level "+S.level+" you prepare <b>"+budget+"</b> spells."
    : sc.mode==="book" ? "Your spellbook holds <b>"+budget+"</b> spells at level "+S.level+" (six at 1st level, two more each level after)."
    : "You know <b>"+budget+"</b> spells at level "+S.level+", chosen permanently.";
  const byLvl=spellsByLevel(), maxL=maxSpellLevel();
  const ordinal=n=>n+(["th","st","nd","rd"][n%100>>3^1&&n%10]||"th");
  const counts={};
  S.spells1.forEach(n=>{ const l=(SPELLS[n]||{}).lvl; if(l) counts[l]=(counts[l]||0)+1; });
  const levelBlocks=Object.keys(byLvl).map(Number).sort((a,b)=>a-b).map(L=>
    drill(ordinal(L)+'-Level Spells <span class="lvl-tag">'+(counts[L]||0)+' of '+byLvl[L].length+' chosen</span>',
      '<div class="pick-list spell-block">'+mkItems(byLvl[L],"spells1",S.spells1)+'</div>', L===1, "spells-L"+L)
  ).join('');
  return '<h3 style="color:var(--gold);font-variant:small-caps;margin-top:18px">Spells ('+ABILITY_INFO[sc.ability].name+')</h3>'
    +'<div class="rules-note">'+modeNote+' Spell save DC = 8 + '+profBonus()+' + '+ABILITY_INFO[sc.ability].name.slice(0,3)+' mod'
    +(maxL?'. You can cast spells up to <b>level '+maxL+'</b>':'')+'.</div>'
    +'<div class="pick-counter">Cantrips <b>'+S.cantrips.length+'</b>/'+cantripMax
    +' · Spells you '+verb+' <b>'+S.spells1.length+'</b>/'+budget
    +(spellsFull?' <span style="color:var(--blood-bright)">— all spent; clear one to choose another</span>':'')+'</div>'
    +(cantripMax?drill('Cantrips <span class="lvl-tag">'+S.cantrips.length+' of '+cantripMax+' chosen</span>','<div class="pick-list spell-block">'+mkItems(list.cantrips||[],"cantrips",S.cantrips)+'</div>', true, "spells-cantrips"):"")
    +(levelBlocks||'<div class="rules-note">No spell slots yet at this level.</div>');
}

/* ---------- Step 4: Background ---------- */
function renderBackground(){
  const cards=Object.entries(BACKGROUNDS).map(([k,b])=>
    '<div class="choice-card'+(S.background===k?' selected':'')+'" data-pick-bg="'+k+'">'
    +'<h3>'+k+'</h3><div class="tagline">'+b.tagline+'</div>'
    +'<div class="statline">Skills: '+b.skills.join(", ")+'</div></div>'
  ).join('');
  let detail="";
  if(S.background){
    const b=BACKGROUNDS[S.background];
    detail='<div class="detail-pane"><h3>'+S.background+'</h3><div class="flavor">'+b.flavor+'</div>'
      +chips(['<b>Skills:</b> '+b.skills.join(", "), '<b>Tools:</b> '+(b.tools.length?b.tools.join(", "):"None"), '<b>Extra Languages:</b> '+b.languages])
      +drill("Feature: "+b.feature.n,"<p>"+b.feature.d+"</p>",true)
      +drill("Starting Equipment","<ul style='padding-left:18px'>"+b.equipment.map(e=>"<li>"+e+"</li>").join("")+"</ul>")
      +'</div>';
  }
  $("step-background").innerHTML=
    '<div class="panel"><h2><span class="ornament">📜</span> Choose Your Background</h2>'
    +'<p class="lede">Where did you come from before the adventuring life? Your background grants two skill proficiencies, equipment, and a unique roleplay feature.</p>'
    +'<div class="card-grid">'+cards+'</div>'+detail
    +'<div class="step-footer"><button class="btn" data-goto="3">◂ Advancement</button><button class="btn gold" data-goto="5">Gear Up ▸</button></div>'
    +'</div>';
}

/* ---------- Step 5: Equipment ---------- */
function renderEquipment(){
  let body="";
  if(!S.klass){
    body='<div class="rules-note">Choose a <b>class</b> first — your starting equipment comes from it.</div>';
  } else {
    const c=CLASSES[S.klass];
    body=c.equipChoices.map((g,gi)=>{
      return '<h3 style="color:var(--gold);font-variant:small-caps;margin-top:12px">'+g.label+'</h3><div class="pick-list">'
        +g.options.map(o=>'<label class="pick-item'+(S.equip[g.label]===o.name?' picked':'')+'">'
          +'<input type="radio" name="eq'+gi+'" data-equip-group="'+g.label+'" data-equip-opt="'+o.name+'"'+(S.equip[g.label]===o.name?' checked':'')+'>'
          +'<span><span class="pi-name">'+o.name+'</span><span class="pi-sub">'+o.detail+'</span></span></label>').join('')+'</div>';
    }).join('');
    if(c.fixedEquip.length) body+='<h3 style="color:var(--gold);font-variant:small-caps;margin-top:12px">Also carried</h3><ul style="padding-left:20px;color:var(--ink-dim)">'+c.fixedEquip.map(e=>'<li>'+e+'</li>').join('')+'</ul>';
    if(S.background) body+='<h3 style="color:var(--gold);font-variant:small-caps;margin-top:12px">From your '+S.background+' background</h3><ul style="padding-left:20px;color:var(--ink-dim)">'+BACKGROUNDS[S.background].equipment.map(e=>'<li>'+e+'</li>').join('')+'</ul>';

    body+='<h3 style="color:var(--gold);font-variant:small-caps;margin-top:16px">Magic Items</h3>'
      +'<div class="rules-note">Optional treasure — add anything your Dungeon Master has awarded you. Items marked <b>(attunement)</b> occupy one of your three attunement slots.</div>'
      +'<div class="pick-counter">Carried: <b>'+S.items.length+'</b> · Attuned: <b>'
      +S.items.filter(i=>MAGIC_ITEMS[i]&&MAGIC_ITEMS[i].attune).length+'</b>/3</div>'
      +drill("Browse the treasure hoard ("+Object.keys(MAGIC_ITEMS).length+" items)",
        '<div class="pick-list">'+Object.entries(MAGIC_ITEMS).map(([n,it])=>
          '<label class="pick-item'+(S.items.includes(n)?' picked':'')+'">'
          +'<input type="checkbox" data-item="'+n+'"'+(S.items.includes(n)?' checked':'')+'>'
          +'<span><span class="pi-name">'+n+'</span><span class="pi-sub">'+it.rarity+' '+it.type.toLowerCase()
          +(it.attune?' · attunement':'')+' — '+it.d+'</span></span></label>').join('')+'</div>',
        S.items.length>0);

    const acInfo=computeAC();
    body+='<h3 style="color:var(--gold);font-variant:small-caps;margin-top:16px">Armor Worn</h3>'
      +'<div class="pick-list">'+c.armorOptions.map(a=>'<label class="pick-item'+((S.armor||c.armorOptions[0])===a?' picked':'')+'">'
        +'<input type="radio" name="armorSel" data-armor="'+a+'"'+((S.armor||c.armorOptions[0])===a?' checked':'')+'>'
        +'<span><span class="pi-name">'+a+'</span><span class="pi-sub">'+ARMOR[a].desc+'</span></span></label>').join('')+'</div>'
      +(c.shieldAllowed?'<label class="pick-item" style="max-width:320px;margin-top:6px"><input type="checkbox" data-shield'+(S.shield?' checked':'')+'><span><span class="pi-name">Carry a shield</span><span class="pi-sub">+2 AC; occupies one hand</span></span></label>':'')
      +'<div class="rules-note" style="margin-top:12px">Your Armor Class: <b style="font-size:1.2rem">'+acInfo.ac+'</b> ('+acInfo.armorKey+(S.shield?' + shield':'')+')'
      +(acInfo.stealthDis?' — <span style="color:var(--blood-bright)">disadvantage on Stealth checks</span>':'')+'</div>';
  }
  $("step-equipment").innerHTML=
    '<div class="panel"><h2><span class="ornament">🗡</span> Starting Equipment</h2>'
    +'<p class="lede">Choose your gear from your class options. Armor and shield determine your Armor Class — how hard you are to hit.</p>'
    +body
    +'<div class="step-footer"><button class="btn" data-goto="4">◂ Background</button><button class="btn gold" data-goto="6">Final Details ▸</button></div>'
    +'</div>';
}

      +'</select>'
      +((custom||cur==="__custom")?'<input type="text" data-bodycustom="'+key+'" value="'+(custom?cur.replace(/"/g,"&quot;"):"")+'" placeholder="Describe it your way…" style="width:100%;margin-top:4px;background:#191208;color:var(--ink);border:1px solid var(--border-dim);border-radius:4px;padding:6px;font-family:var(--serif)">':'')

  const physiqueUI=

    +' <small style="color:var(--ink-dim);font-size:.72rem;letter-spacing:0">'+(S.race?('options tuned to the '+S.race):'choose a race for tailored lists')+'</small></h3>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:10px;margin-top:6px">'
    +selBody("height","Height",heightOpts)
    +selBody("weight","Weight",weightOpts)
    +selBody("hair","Hair",phys.hair)
    +selBody("eyes","Eyes",phys.eyes)
    +selBody("skin",skinLabel,phys.skin)

    +'<textarea data-bodynotes rows="3" placeholder="A burn scar across the left brow; walks with a hunter\'s quiet; smells faintly of temple incense…" style="width:100%;background:#191208;color:var(--ink);border:1px solid var(--border-dim);border-radius:5px;padding:8px;font-family:var(--serif)">'+(S.body.notes||"")+'</textarea></div>';

    '<h3 style="color:var(--gold);font-variant:small-caps;margin-top:18px">Character Art</h3>'
    +'<div class="art-drop" data-act="art-pick">'
    +(S.art
      ?'<img src="'+S.art+'" alt="Character portrait"><div style="margin-top:8px">Click to replace · <span data-act="art-clear" style="color:var(--blood-bright);cursor:pointer">✖ remove</span></div>'
      :'🖼 Click to add a portrait — JPG or PNG<br><small>It becomes a half-page insert on your character sheet</small>')
    +'</div>'
    +'<input type="file" id="art-file" accept="image/png,image/jpeg" style="display:none">';
  $("step-details").innerHTML=
    '<div class="panel"><h2><span class="ornament">🕯</span> Name &amp; Nature</h2>'
    +'<p class="lede">Give your hero a name, an alignment, and the sparks of personality that bring them to life at the table.</p>'
    +'<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">'
    +'<input id="char-name" type="text" placeholder="Character name…" value="'+S.name.replace(/"/g,"&quot;")+'" style="flex:1;min-width:220px;background:#191208;color:var(--ink);border:1px solid var(--border-gold);border-radius:5px;padding:10px 14px;font-family:var(--serif);font-size:1.15rem">'
    +'<button class="btn" data-act="suggest-name">⚂ Suggest a name</button></div>'
    +'<h3 style="color:var(--gold);font-variant:small-caps">Alignment</h3>'
    +'<div class="card-grid" style="grid-template-columns:repeat(auto-fill,minmax(180px,1fr))">'+alignCards+'</div>'
    +physiqueUI+artUI
    +'<h3 style="color:var(--gold);font-variant:small-caps;margin-top:16px">Personality</h3>'
    +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px">'
    +[["traits","Personality Traits","e.g. I face problems head-on; a simple direct solution is best."],
      ["ideals","Ideals","e.g. Freedom — chains are meant to be broken."],

        +'<textarea data-persona="'+k+'" rows="3" placeholder="'+ph+'" style="width:100%;background:#191208;color:var(--ink);border:1px solid var(--border-dim);border-radius:5px;padding:8px;font-family:var(--serif)">'+(P[k]||"")+'</textarea></div>').join('')
    +'</div>'
